<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vörös gerincfelület – Vel M2 próba</title>
<style>
  :root { --bg:#0c0b0d; --panel:rgba(18,16,20,.86); --fg:#ece8ea; --mute:#9d959b; --line:rgba(255,255,255,.1); --acc:#e0374a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.35 -apple-system,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  canvas#cv { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #panel { position:fixed; top:12px; right:12px; width:290px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel); backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-sizing:border-box; }
  #panel h1 { font-size:13px; margin:0 0 2px; font-weight:650; }
  #panel .sub { color:var(--mute); font-size:11.5px; margin-bottom:10px; }
  .row { margin:9px 0; }
  .row > label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .row > label output { color:var(--mute); font-variant-numeric:tabular-nums; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pair small { display:block; color:var(--mute); font-size:10.5px; }
  input[type=range] { width:100%; accent-color:var(--acc); margin:0; }
  details { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  summary { cursor:pointer; color:var(--mute); font-size:12px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  button { font:inherit; font-size:12px; color:var(--fg); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:7px; padding:6px 9px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.13); }
  button[aria-pressed=true] { background:var(--acc); border-color:var(--acc); }
  select { font:inherit; font-size:12px; background:#1c1a1e; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 5px; width:100%; }
  #hud { position:fixed; left:12px; bottom:12px; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 10px; font:11.5px/1.45 ui-monospace,Menlo,monospace; color:var(--mute); white-space:pre; }
  #hud b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel" role="region" aria-label="Vezérlők">
  <h1>Vörös gerincfelület</h1>
  <div class="sub">Vel M2 látványpróba · húzd a képet a forgatáshoz</div>
  <div id="main"></div>
  <details id="more"><summary>Továbbiak</summary><div id="adv"></div></details>
</div>
<div id="hud" aria-live="off"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
