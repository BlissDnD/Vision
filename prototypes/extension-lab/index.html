<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./gallery.css"><title>Vel – külön bővítménylabor</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#111925;color:#e1e8f2}body{max-width:1120px;margin:24px auto;padding:0 16px}h1{font-size:24px}p{line-height:1.5;color:#aebcd0}select,button,input{font:inherit}select,button{padding:9px;border:1px solid #536579;border-radius:6px;background:#233247;color:inherit}select{max-width:100%}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px}canvas{width:100%;height:auto;background:#182334;border:1px solid #536579;border-radius:8px}#panel{overflow:auto;max-height:560px;background:#182334;padding:12px;border-radius:8px}pre{font:12px ui-monospace;white-space:pre-wrap;overflow-wrap:anywhere}#panel button{margin:5px}.controls{display:flex;align-items:center;gap:12px;margin:12px 0}#time{flex:1}.gutter{background:#66768a;cursor:col-resize}.controls label{white-space:nowrap}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style></head><body>
<h1>Vel – külön bővítménylabor</h1><p>63 elkülönített prototípus. Válassz egyet a próbához. A fő alkalmazás és a projektjeid állapota nem kapcsolódik ehhez a laborhoz.</p>
<label for="module">Bővítmény </label><select id="module"></select>
<div class="controls"><button id="play">Lejátszás</button><label for="time">Jelenetidő</label><input id="time" type="range" min="0" max="5" step="0.0166667" value="0"><button id="reset">Újraindítás</button></div>
<p id="status" role="status"></p><div class="layout"><canvas width="720" height="480" aria-label="Bővítmény előnézete"></canvas><div id="panel"></div></div>
<script type="module" src="./gallery.mjs"></script></body></html>
