<title>Látomás Stúdió</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Unbounded:wght@300;700&family=Syne:wght@500;800&family=Orbitron:wght@500;800&family=Major+Mono+Display&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Instrument+Sans:wght@400;600;700&family=Bricolage+Grotesque:wght@400;700;800&family=Fraunces:wght@400;700&display=swap">
<style>
/* Layout: lebegő, lekerekített panelek egy sötét műhelyben — bal: rétegfa, közép: vászon lebegő eszköz-HUD-dal, jobb: inspector, alul: könyvtár-polc. Apple Pro-alkalmazás érzet: rendszerbetű, finom elválasztók, szegmentált vezérlők, kevés de nagy kontroll. */
:root{
  color-scheme:dark;
  --bg:#111113; --stage:#0a0a0c; --chrome:rgba(30,30,33,.82); --side:#1c1c1f; --card:#2a2a2e; --hover:rgba(255,255,255,.06);
  --sep:rgba(255,255,255,.08); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.14); --seg-on:#5b5b60;
  --fg:#f5f5f7; --fg2:#a1a1a8; --fg3:#68686f; --accent:#7472f5; --accent-soft:rgba(116,114,245,.22); --on-accent:#fff;
  --danger:#ff5a50; --ok:#30d158; --thumb:#ffffff; --shadow:0 12px 40px rgba(0,0,0,.45);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --fm:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9e9ee; --stage:#d4d4da; --chrome:rgba(248,248,250,.85); --side:#f6f6f8; --card:#ffffff; --hover:rgba(0,0,0,.04);
  --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.09); --seg-on:#ffffff;
  --fg:#1d1d1f; --fg2:#6b6b72; --fg3:#a3a3aa; --accent:#5856d6; --accent-soft:rgba(88,86,214,.14); --on-accent:#fff;
  --danger:#e5372c; --ok:#1f9d48; --shadow:0 12px 40px rgba(0,0,0,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e9e9ee; --stage:#d4d4da; --chrome:rgba(248,248,250,.85); --side:#f6f6f8; --card:#ffffff; --hover:rgba(0,0,0,.04);
  --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.09); --seg-on:#ffffff;
  --fg:#1d1d1f; --fg2:#6b6b72; --fg3:#a3a3aa; --accent:#5856d6; --accent-soft:rgba(88,86,214,.14); --on-accent:#fff;
  --danger:#e5372c; --ok:#1f9d48; --shadow:0 12px 40px rgba(0,0,0,.14); color-scheme:light}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}

#app{height:100%;display:grid;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:236px minmax(0,1fr) 296px;grid-template-rows:48px minmax(0,1fr) 176px;
  grid-template-areas:"bar bar bar" "layers stage insp" "layers shelf insp"}
.panel{background:var(--side);border:1px solid var(--sep);border-radius:14px;min-width:0;min-height:0;overflow:hidden}

/* ----- top bar ----- */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;background:var(--chrome);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 200deg,#ff9f0a,#ff375f,#bf5af2,#5e5ce6,#64d2ff,#30d158,#ff9f0a);box-shadow:inset 0 0 0 4px var(--side)}
.grow{flex:1}
.transport{display:flex;align-items:center;gap:2px;background:var(--fill2);border-radius:9px;padding:2px}
.time{font:500 12px var(--fm);font-variant-numeric:tabular-nums;color:var(--fg2);min-width:64px;text-align:center}
.ib{width:30px;height:28px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.ib.rec{color:var(--danger)}
.ib.rec.on{background:var(--danger);color:#fff}
.ib[disabled]{opacity:.35;cursor:default}
.pill{height:28px;border:0;border-radius:8px;padding:0 11px;background:var(--fill);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{filter:brightness(1.15)}
.pill.accent{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ----- layers ----- */
.layers{grid-area:layers;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;font-weight:600;font-size:13px}
.ltree{list-style:none;margin:0;padding:2px 6px 8px;overflow:auto;flex:1}
.lr{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border-radius:7px;cursor:default;user-select:none;position:relative}
.lr:hover{background:var(--hover)}
.lr.sel{background:var(--accent);color:var(--on-accent)}
.lr.sel .lk,.lr.sel .eye{color:inherit;opacity:.85}
.lr.off .ln{opacity:.4}
.lr.drop-in{box-shadow:inset 0 0 0 2px var(--accent)}
.lr.drop-above::before{content:"";position:absolute;left:6px;right:6px;top:-1px;height:2px;border-radius:1px;background:var(--accent)}
.chev{width:14px;height:14px;border:0;background:none;padding:0;color:var(--fg3);transition:transform .15s;flex:none}
.chev.open{transform:rotate(90deg)}
.lr.sel .chev{color:inherit}
.lr .clip{width:14px;color:var(--fg3);font-size:12px;line-height:1;flex:none;text-align:center}
.lr.sel .clip{color:inherit}
.lic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--fill2);color:var(--fg2)}
.lr.sel .lic{background:rgba(255,255,255,.22);color:#fff}
.lic svg{width:14px;height:14px}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{font-size:10.5px;color:var(--fg3)}
.eye{width:22px;height:22px;border:0;background:none;border-radius:5px;display:grid;place-items:center;color:var(--fg3);opacity:0;flex:none}
.lr:hover .eye,.lr.off .eye,.eye:focus-visible{opacity:1}
.eye svg{width:14px;height:14px}
.lfoot{display:flex;gap:2px;padding:6px;border-top:1px solid var(--sep)}
.lfoot .ib{flex:1;height:26px}
.lempty{color:var(--fg3);padding:12px;font-size:12px}

/* ----- stage ----- */
.stage{grid-area:stage;position:relative;background:var(--stage);display:flex}
.wrap{flex:1;position:relative;min-width:0;display:grid;place-items:center;touch-action:none;overflow:hidden}
#cv{display:block;box-shadow:0 0 0 1px var(--sep),var(--shadow);background:#000}
.hudbar{position:absolute;left:12px;top:12px;display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);z-index:3}
.hudbar .ib{width:32px;height:30px}
.hudbar .ib[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.hudbar .sepv{width:1px;background:var(--sep);margin:4px 3px}
.gizmo{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
.gizmo .ring{position:absolute;left:0;top:0;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.gizmo .h{position:absolute;width:14px;height:14px;transform:translate(-50%,-50%);background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4);pointer-events:auto;touch-action:none}
.gizmo .h.s{border-radius:3px;cursor:nwse-resize}
.gizmo .h.r{cursor:grab;background:var(--accent)}
.gizmo .stem{position:absolute;width:1.5px;background:rgba(255,255,255,.85);transform-origin:50% 100%}
.gizmo .dot{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.audition{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:3;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hud{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:7px;font:11px var(--fm);color:var(--fg2);background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);border-radius:999px;padding:5px 11px;z-index:3;cursor:help;max-width:calc(100% - 200px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud i{width:7px;height:7px;border-radius:50%;flex:none}
.errdot{width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font:700 11px/16px var(--f);text-align:center;flex:none}
.errbox{margin:0 14px 10px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--fg);font-size:12px}
.errbox pre{margin:6px 0 0;font:10.5px/1.4 var(--fm);white-space:pre-wrap;max-height:140px;overflow:auto;color:var(--fg2)}
.cost{display:flex;gap:1.5px;align-items:flex-end;height:10px;flex:none;color:var(--fg3)}
.cost i{width:2.5px;border-radius:1px;background:currentColor}
.lr.sel .cost{color:inherit;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:11px;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);z-index:3}
.tl .ib{width:28px;height:26px}.tl .ib[aria-pressed=true]{color:var(--accent)}
.tl-track{flex:1;position:relative;height:22px;border-radius:6px;background:var(--fill2);cursor:pointer;touch-action:none;overflow:hidden;min-width:0}
.tl-segs{position:absolute;inset:0}
.tl-seg{position:absolute;top:5px;height:12px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent)}
.tl-seg.out{background:transparent;border-style:dashed}
.tl-beat{position:absolute;top:0;bottom:0;width:1px;background:var(--sep)}
.tl-head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none}
.tl .val{width:44px}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sigchip{position:relative;overflow:hidden;border:0;border-radius:8px;padding:7px 9px;background:var(--fill2);font-size:12px;cursor:grab;text-align:left;white-space:nowrap;text-overflow:ellipsis}
.sigchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:calc(var(--lv,0)*100%)}
.ctl.sigdrop{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px}
.chip{border:0;border-radius:999px;padding:5px 11px;background:var(--fill2);font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.popover.wide{min-width:340px;max-width:min(390px,calc(100vw - 32px))}
.axhint{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);margin-top:-2px}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.drophint{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;pointer-events:none;z-index:4}

/* ----- shelf ----- */
.shelf{grid-area:shelf;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:12px;padding:10px 12px 6px;flex-wrap:wrap}
.shead .hint{color:var(--fg3);font-size:11.5px;margin-left:auto}
.seg{display:inline-flex;background:var(--fill2);border-radius:8px;padding:2px;gap:1px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;font-size:12px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.items{display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 12px 10px;flex:1;align-items:start}
.item{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--fg)}
.item canvas{width:128px;height:80px;border-radius:9px;background:#000;box-shadow:0 0 0 1px var(--sep)}
.item:hover canvas,.item:focus-visible canvas{box-shadow:0 0 0 2px var(--accent)}
.item span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ----- inspector ----- */
.insp{grid-area:insp;display:flex;flex-direction:column}
.ibody{overflow:auto;flex:1;padding:0 0 16px}
.ihead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.ihead .lic{width:34px;height:34px;border-radius:9px}
.ihead .lic svg{width:18px;height:18px}
.ihead .tt{flex:1;min-width:0}
.ihead input{width:100%;border:0;background:none;font-weight:600;font-size:15px;padding:1px 3px;margin-left:-3px;border-radius:5px}
.ihead input:hover,.ihead input:focus{background:var(--fill2)}
.ihead small{display:block;color:var(--fg2);font-size:11.5px}
.desc{padding:0 14px 10px;color:var(--fg2);font-size:12px;margin:0}
.sec{border-top:1px solid var(--sep);padding:0 14px}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--fg3);border-bottom:1.5px solid var(--fg3);transform:rotate(-45deg);transition:transform .15s;margin-right:3px}
.sec[open]>summary::after{transform:rotate(45deg)}
.sec .content{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2)}
.ctl .top .lab{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ctl .top .lab .ad{width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.ctl.anim .top .lab .ad{display:block}
.val{font:12px var(--fm);font-variant-numeric:tabular-nums;color:var(--fg);border:0;background:none;width:58px;text-align:right;padding:1px 3px;border-radius:4px}
.val:hover,.val:focus{background:var(--fill2)}
.anb{width:20px;height:20px;border:0;border-radius:5px;background:none;color:var(--fg3);display:grid;place-items:center;opacity:0}
.ctl:hover .anb,.ctl.anim .anb,.anb:focus-visible{opacity:1}
.ctl.anim .anb{color:var(--accent)}
.anb svg{width:13px;height:13px}
.ctl.big .top{font-size:13px;color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;--p:50%;display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--fill) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--thumb);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--thumb);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.ctl.big input[type=range]{height:24px}
.ctl.big input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.ctl.big input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px}
.rngw{position:relative}
.rngw .mod{position:absolute;top:1px;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateX(-2.5px);pointer-events:none;box-shadow:0 0 0 2px var(--side)}
.lfo{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--fill2);font-size:11.5px;color:var(--fg2);margin-top:4px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--fg2)}
.row2>span:first-child{min-width:0}
.pop{position:relative;display:inline-flex;min-width:0}
.pop select{appearance:none;-webkit-appearance:none;border:0;background:var(--fill);border-radius:7px;padding:4px 26px 4px 10px;font-size:12.5px;max-width:170px;min-width:0}
.pop::after{content:"";position:absolute;right:10px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--fg2);border-bottom:1.5px solid var(--fg2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:var(--fill);position:relative;flex:none;margin:0;transition:background .15s;cursor:pointer}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(14px)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:24px;height:24px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--side),0 0 0 4px var(--accent)}
.cwell{appearance:none;-webkit-appearance:none;width:44px;height:24px;border:0;border-radius:7px;padding:0;background:none;cursor:pointer}
.cwell::-webkit-color-swatch-wrapper{padding:0}.cwell::-webkit-color-swatch{border:0;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cwell::-moz-color-swatch{border:0;border-radius:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scrub{display:flex;align-items:center;height:28px;border-radius:7px;background:var(--fill2);padding:0 4px 0 9px;cursor:ew-resize;user-select:none;touch-action:none;min-width:0}
.scrub b{font-weight:500;font-size:11.5px;color:var(--fg3);min-width:30px}
.scrub input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:right;font:12px var(--fm);font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px;cursor:text}
.scrub input:focus{background:var(--fill)}
.fxl{display:flex;flex-direction:column;gap:6px}
.fxi{border-radius:10px;background:var(--fill2)}
.fxi>header{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px}
.fxi>header .ln{font-size:12.5px;cursor:pointer}
.fxi>header .eye{opacity:1}
.fxi .fxb{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px}
.addfx .pop{width:100%}.addfx .pop select{max-width:none;width:100%}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:28px;border:0;border-radius:7px;padding:0 12px;background:var(--fill);font-size:12.5px}
.btn:hover{filter:brightness(1.15)}
.btn.accent{background:var(--accent);color:var(--on-accent);font-weight:600}
textarea.code{width:100%;min-height:220px;font:11.5px/1.5 var(--fm);resize:vertical;tab-size:2;white-space:pre;border:0;border-radius:8px;background:var(--fill2);padding:8px}
input.txt{width:100%;min-width:0;flex:1;border:0;border-radius:7px;background:var(--fill2);padding:6px 9px;font-size:13px}
.msg{font:11px var(--fm);white-space:pre-wrap}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.small{font-size:11.5px;color:var(--fg3);margin:0}
.empty{padding:20px 14px;color:var(--fg2);font-size:12.5px}

/* ----- popover / modal / toast ----- */
.lookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lkb{height:30px;border:0;border-radius:8px;background:var(--fill2);font-size:12px}

vec2 map(vec3 p){

vec3 calcN(vec3 p){vec2 e=vec2(0.0015,-0.0015);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}

float fbm3(vec3 p){return n3(p)*0.6+n3(p*2.1+3.1)*0.3+n3(p*4.3+7.7)*0.1;}
vec3 envMap(vec3 d,float rough){

float softShadow(vec3 ro,vec3 rd){float res=1.0,tt=0.02;for(int i=0;i<32;i++){float hh=map(ro+rd*tt).x;res=min(res,10.0*hh/tt);tt+=clamp(hh,0.02,0.25);if(res<0.004||tt>5.0)break;}return clamp(res,0.0,1.0);}
float calcAO(vec3 pos,vec3 n){float occ=0.0,sca=1.0;for(int i=0;i<5;i++){float hh=0.02+0.11*float(i);float d=map(pos+n*hh).x;occ+=(hh-d)*sca;sca*=0.9;}return clamp(1.0-2.5*occ,0.0,1.0);}
vec3 shadePBR(vec3 n,vec3 rd,vec3 alb,float rough,float metal,float ao,float sh){

vec4 render(vec2 p){

    vec3 gw=transpose(gM)*g; n=normalize(n-p_detail*0.12*(gw-n*dot(gw,n))); rough=clamp(rough+(fbm3(q*0.5)-0.5)*p_detail*0.4,0.02,1.0);}
  float diffK=max(dot(n,L),0.0); float specK=pow(max(dot(n,normalize(L+v)),0.0),48.0);
  int mt=int(p_material+0.5);
  if(hit.y>0.5){float r=length((rX(0.35)*lq).xz); alb=pal(0.1+r*0.6)*(0.45+0.55*sin(r*70.0)); rough=0.6; metal=0.0; a=0.85*clamp(p_ring*1.5,0.0,1.0);}
  else if(mt==0){alb=pal(fres*0.9+n.y*0.3+t*0.05); metal=max(metal,0.75); rough=rough*0.6;}
  else if(mt==1){float vv=sin(lq.x*4.0+t)+sin(lq.y*5.0-t*1.3)+sin(lq.z*3.0+t*0.7)+sin(length(lq)*8.0-t*2.0); alb=pal(vv*0.15+t*0.05); emit=alb*0.35;}
  else if(mt==2){float f=fbm(lq.xy*2.2+lq.z*1.3)*0.6+fbm(lq.yz*2.0+3.1)*0.4; float land=smoothstep(0.48,0.53,f);
    alb=mix(pal(0.6)*0.3,pal(0.12+f*0.6)*0.85,land); rough=mix(0.18,0.85,land);

vec4 fx(){

 lib:`float sdStar(vec2 p,float r,float n,float m){float an=PI/n;float en=PI/m;vec2 acs=vec2(cos(an),sin(an));vec2 ecs=vec2(cos(en),sin(en));

float sdMoon(vec2 p,float d,float ra,float rb){p.y=abs(p.y);float a=(ra*ra-rb*rb+d*d)/(2.0*d);float b=sqrt(max(ra*ra-a*a,0.0));

float sdPolyN(vec2 p,float n,float r){float a=atan(p.x,p.y);float s=TAU/n;float b=mod(a+s*0.5,s)-s*0.5;return length(p)*cos(b)-r*cos(s*0.5);}

float sdHeart(vec2 p){p.x=abs(p.x);if(p.y+p.x>1.0) return sqrt(dot2(p-vec2(0.25,0.75)))-sqrt(2.0)/4.0;return sqrt(min(dot2(p-vec2(0.0,1.0)),dot2(p-0.5*max(p.x+p.y,0.0))))*sign(p.x-p.y);}
float sdCross(vec2 p,vec2 b){p=abs(p);p=(p.y>p.x)?p.yx:p.xy;vec2 q=p-b;float k=max(q.y,q.x);vec2 w=(k>0.0)?q:vec2(b.y-p.x,-k);return sign(k)*length(max(w,0.0));}`,
 code:`vec4 fx(){
  vec2 p=P(); p.x/=max(p_aspect,0.01); float r=p_size; float d;

  else if(p_kind<9.5){float rr=length(p); float an=atan(p.y,p.x); float bb=r/(2.0+p_inner*6.0); float sd=abs(mod(rr-bb*an/TAU+bb*0.5,bb)-bb*0.5)-p_thick*0.5; d=max(sd,rr-r);}
  else if(p_kind<10.5){float o=r*0.55; float dv=max(length(p-vec2(0.0,o))-r,length(p+vec2(0.0,o))-r); d=min(abs(dv)-p_thick*0.6,max(length(p)-r*0.33,-(length(p)-r*0.12)));}
  else if(p_kind<11.5) d=sdCross(p,vec2(r,r*(0.12+p_inner*0.4)));
  else {float a2=r*r*1.44; float x2=p.x*p.x,y2=p.y*p.y; float f=(x2+y2)*(x2+y2)-a2*(x2-y2); vec2 gr=vec2(4.0*p.x*(x2+y2)-2.0*a2*p.x,4.0*p.y*(x2+y2)+2.0*a2*p.y); d=abs(f)/max(length(gr),0.0001)-p_thick*0.6;}

text:{kind:'text',name:'Szöveg',desc:'Felirat palettás csillogással és ragyogással.',main:['tint','glow'],
 params:[S('tint','Színezés',0,1,.7),S('glow','Ragyogás',0,3,1),S('spread','Színterjedés',0,3,.6),S('shimmer','Csillogás',0,4,1)],
 code:`vec4 fx(){vec2 p=P(); float ia=uImgSize.x/max(uImgSize.y,1.0); vec2 uv=vec2(p.x/ia,p.y)+0.5;
  float inb=step(0.0,uv.x)*step(uv.x,1.0)*step(0.0,uv.y)*step(uv.y,1.0);
  float a=texture(uImage,clamp(uv,0.0,1.0)).a*inb; float g=0.0;
  for(int i=0;i<12;i++){float an=float(i)*2.39996; vec2 off=vec2(cos(an),sin(an))*(0.01+0.02*float(i)/12.0)*vec2(1.0/ia,1.0)*1.5; g+=texture(uImage,clamp(uv+off,0.0,1.0)).a;}
  g=g/12.0*p_glow; vec3 rgb=mix(vec3(1.0),pal(uv.x*p_spread+uTime*p_shimmer*0.2),p_tint);
  float A=clamp(max(a,g*0.8),0.0,1.0); return vec4((rgb+rgb*g*0.6)*A,A);}`},
image:{kind:'image',name:'Kép',desc:'Saját kép rétegként — fotó, logó, textúra.',noPal:true,main:['bright','sat'],
 params:[S('bright','Fényerő',0,3,1),S('sat','Telítettség',0,3,1)],
 code:`vec4 fx(){vec2 p=P(); float ia=uImgSize.x/max(uImgSize.y,1.0); vec2 uv=vec2(p.x/ia,p.y)+0.5;
  float inb=step(0.0,uv.x)*step(uv.x,1.0)*step(0.0,uv.y)*step(uv.y,1.0);
  vec4 c=texture(uImage,clamp(uv,0.0,1.0)); vec3 rgb=mix(vec3(luma(c.rgb)),c.rgb,p_sat)*p_bright; float A=c.a*inb; return vec4(rgb*A,A);}`},
custom:{kind:'gen',name:'Saját GLSL',desc:'Saját shader élőben. IN(uv) az alatta lévő kép, így szűrőt is írhatsz.',main:['a','b','c','d'],
 params:[S('a','p_a',0,1,.5),S('b','p_b',0,1,.5),S('c','p_c',0,1,.5),S('d','p_d',0,1,.5)],code:''},
/* ---------- filters (input & output premultiplied) ---------- */
blur:{kind:'fx',name:'Elmosás',desc:'Lágy Gauss-elmosás. Alakzatra húzva puha szélű maszkot kapsz.',passes:2,main:['radius'],
 params:[S('radius','Erősség',0,10,2)],
 code:`vec4 fx(){vec2 dir=uPass<0.5?vec2(1.0/uRes.x,0.0):vec2(0.0,1.0/uRes.y); float r=p_radius*uRes.y*0.004;
  vec4 acc=vec4(0.0); float ws=0.0;
  for(int i=-12;i<=12;i++){float x=float(i)/12.0; float w=exp(-x*x*4.0); acc+=IN(vUv+dir*x*r*3.0)*w; ws+=w;}
  return acc/ws;}`},
glow:{kind:'fx',name:'Ragyogás',desc:'Puha, kétlépcsős Gauss-ragyogás: a fényes részek szétsugároznak.',passes:2,main:['amount','radius','thresh'],
 params:[S('amount','Erősség',0,3,1),S('radius','Sugár',.2,4,1.5),S('thresh','Küszöb',0,1,.35)],
 code:`vec4 fx(){vec2 dir=uPass<0.5?vec2(1.0/uRes.x,0.0):vec2(0.0,1.0/uRes.y); float r=p_radius*uRes.y*0.006;
  vec4 acc=vec4(0.0); float ws=0.0;
  for(int i=-12;i<=12;i++){float x=float(i)/12.0; float w=exp(-x*x*3.0); vec4 sm=IN(vUv+dir*x*r*3.0);
    if(uPass<0.5) sm*=smoothstep(p_thresh,p_thresh+0.25,luma(unp(sm))); acc+=sm*w; ws+=w;}
  acc/=ws;
  if(uPass<0.5) return acc;
  vec4 c=texture(uPrev,vUv); vec3 g=acc.rgb*p_amount*2.0; return vec4(c.rgb+g,clamp(c.a+luma(g),0.0,1.0));}`},
lens:{kind:'fx',name:'Téridő-görbület',desc:'Gravitációs lencse és téridő-hullámok a réteg középpontja körül. Húzd oda, ahol hajlítani akarsz.',usesPal:true,main:['mass','ripple','hole'],
 params:[S('mass','Tömeg',0,3,1),S('ripple','Gravitációs hullám',0,3,.6),S('hole','Fekete mag',0,1.5,.8),S('ring','Gyűrűfény',0,3,.8),S('waves','Hullámsűrűség',0,4,1),S('speed','Sebesség',0,4,1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r2=max(dot(q,q),0.000001); float r=sqrt(r2); float m=p_mass*p_mass*0.04; float re=sqrt(m);
  vec2 src=q-q*(m/r2); float t=uTime*p_speed; src+=q/r*sin(r*p_waves*25.0-t*3.0)*p_ripple*0.01*exp(-r*1.5);
  vec4 c=IN(toUV(src))*smoothstep(re*p_hole*0.9,re*p_hole*1.1+0.0001,r);
  float ring=exp(-abs(r-re)*60.0)*p_ring; return vec4(c.rgb+pal(0.1+t*0.05)*ring,clamp(c.a+ring,0.0,1.0));}`},
kaleido:{kind:'fx',name:'Kaleidoszkóp',desc:'Tükrös szeletekre bontja az alatta lévő képet.',main:['segments','spin','zoom'],
 params:[S('segments','Szeletek',1,24,8,1),S('spin','Pörgés',-3,3,.3),S('zoom','Nagyítás',.2,3,1),S('angle','Szög',-3.14,3.14,0),S('shift','Mintavételi eltolás',-1,1,.15)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float a=atan(q.y,q.x)+uTime*p_spin*0.2; float s=TAU/max(p_segments,1.0); a=mod(a,s); a=abs(a-s*0.5);
  q=rot(p_angle)*(vec2(cos(a),sin(a))*r*p_zoom); q.x+=p_shift; return IN(mfr(toUV(q)));}`},
feedback:{kind:'fx',name:'Visszhang',desc:'Feedback-hurok: az előző képkocka nagyítva, forgatva visszaíródik — végtelen csóvák.',feedback:true,main:['decay','zoom','rot'],
 params:[S('decay','Lecsengés',0,1,.92,.005),S('zoom','Zoom',-5,5,1.2),S('rot','Forgás',-5,5,.6),S('drift','Színvándorlás',-5,5,1),S('wobble','Remegés',0,3,.3),SEL('mode','Mód',['Fényes','Keverés'],0)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec2 q=toQ(vUv); q=rot(p_rot*0.02)*q/(1.0+p_zoom*0.01);
  vec2 pv=toUV(q)+vec2(fbm(vUv*3.0+uTime*0.2)-0.5,fbm(vUv*3.0+7.0-uTime*0.2)-0.5)*p_wobble*0.01;
  vec4 pr=texture(uPrev,pv); pr=vec4(hueShift(pr.rgb,p_drift*0.01),pr.a)*p_decay;
  return p_mode<0.5?max(c,pr):mix(c,pr,p_decay);}`},
swirl:{kind:'fx',name:'Örvény',desc:'Spirálba csavarja a képet a középpont körül.',main:['amount','radius','speed'],
 params:[S('amount','Erősség',-6,6,1.5),S('radius','Hatósugár',.05,2,.5),S('speed','Pörgés',-3,3,.4)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float k=exp(-r/max(p_radius,0.01)); q=rot(p_amount*k*3.0+uTime*p_speed*k)*q; return IN(mfr(toUV(q)));}`},
warp:{kind:'fx',name:'Organikus torzítás',desc:'Zajjal hullámoztatja a képet. Maszkra húzva élő, lélegző széleket ad.',main:['amount','scale','speed'],
 params:[S('amount','Erősség',0,3,.6),S('scale','Lépték',.2,5,1.2),S('speed','Sebesség',0,3,.4)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float t=uTime*p_speed; vec2 n=vec2(fbm(q*p_scale*3.0+t),fbm(q*p_scale*3.0+vec2(5.2,1.3)-t))-0.5; return IN(toUV(q+n*p_amount*0.12));}`},
ripple:{kind:'fx',name:'Hullámzás',desc:'Koncentrikus vagy vízszerű hullámtorzítás.',main:['amount','freq','mode'],
 params:[SEL('mode','Típus',['Sugaras','Vízfelszín'],0),S('amount','Erősség',0,4,1),S('freq','Frekvencia',.2,4,1),S('speed','Sebesség',0,4,1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q)+0.00001; float t=uTime*p_speed;
  vec2 dq=p_mode<0.5?(q/r)*sin(r*p_freq*20.0-t*3.0)*p_amount*0.02:vec2(sin(q.y*p_freq*10.0+t*2.0),sin(q.x*p_freq*10.0+t*1.7))*p_amount*0.02;
  return IN(mfr(toUV(q+dq)));}`},
radial:{kind:'fx',name:'Fénysugarak',desc:'Isteni sugarak: a fények a középpontból sugároznak ki.',main:['amount','length','thresh'],
 params:[S('amount','Erősség',0,3,1),S('length','Hossz',0,3,1.2),S('thresh','Küszöb',0,1,.3)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec2 ctr=toUV(vec2(0.0)); vec2 d=(vUv-ctr)*p_length*0.5; vec4 acc=vec4(0.0); float w=1.0;
  for(int i=0;i<32;i++){vec4 s=IN(vUv-d*float(i)/32.0); acc+=s*w*smoothstep(p_thresh,p_thresh+0.2,luma(unp(s))); w*=0.95;}
  acc=acc/14.0*p_amount; return vec4(c.rgb+acc.rgb,clamp(c.a+acc.a,0.0,1.0));}`},
edge:{kind:'fx',name:'Neon körvonal',desc:'Izzó vonalat rajzol a formák szélére. Alakzatokon és szövegen különösen szép.',usesPal:true,main:['amount','width','only'],
 params:[S('amount','Erősség',0,4,1.5),S('width','Vastagság',.5,6,1.5),S('only','Csak a vonal',0,1,0),S('speed','Színmozgás',0,3,.5)],
 code:`float edgeV(vec2 uv){vec4 c=IN(uv); return c.a*0.6+luma(c.rgb)*0.4;}
vec4 fx(){vec2 px=p_width/uRes; float gx=edgeV(vUv+vec2(px.x,0.0))-edgeV(vUv-vec2(px.x,0.0)); float gy=edgeV(vUv+vec2(0.0,px.y))-edgeV(vUv-vec2(0.0,px.y));
  float e=clamp(length(vec2(gx,gy))*2.0,0.0,1.0); vec4 c=IN(vUv)*(1.0-p_only);
  vec3 ec=pal(vUv.x*0.5+vUv.y*0.5+uTime*p_speed*0.1)*e*p_amount; return vec4(c.rgb+ec,clamp(max(c.a,e),0.0,1.0));}`},
mirror:{kind:'fx',name:'Tükör',desc:'Szimmetria: félbe, négybe vagy nyolcba tükrözve.',main:['mode'],
 params:[SEL('mode','Szimmetria',['Bal-jobb','Fent-lent','Négyes','Nyolcas'],2)],
 code:`vec4 fx(){vec2 q=toQ(vUv); if(p_mode<0.5) q.x=abs(q.x); else if(p_mode<1.5) q.y=abs(q.y); else if(p_mode<2.5) q=abs(q); else {q=abs(q); if(q.y>q.x) q=q.yx;} return IN(mfr(toUV(q)));}`},
polar:{kind:'fx',name:'Poláris tér',desc:'Az alsó képet körbe vagy alagútba hajlítja.',main:['mode','repeat','speed'],
 params:[SEL('mode','Típus',['Körbe','Alagút'],1),S('zoom','Nagyítás',.2,4,1),S('repeat','Ismétlés',1,8,2,1),S('speed','Sebesség',-3,3,.5),S('spin','Pörgés',-3,3,0)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float a=atan(q.y,q.x)/TAU+0.5;
  vec2 uv=p_mode<0.5?vec2(a*p_repeat+uTime*p_spin*0.05,r*p_zoom-uTime*p_speed*0.1):vec2(a*p_repeat+uTime*p_spin*0.05,0.5/max(r,0.001)*p_zoom*0.2+uTime*p_speed*0.2);
  return IN(mfr(uv));}`},
chroma:{kind:'fx',name:'Kromatikus aberráció',desc:'Szétcsúsztatott RGB-csatornák.',main:['amount','wobble'],
 params:[S('amount','Erősség',0,4,1),S('wobble','Lüktetés',0,1,.3),SEL('radial','Irány',['Vízszintes','Sugaras'],1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); vec2 d=(p_radial>0.5?q*length(q):vec2(0.5,0.0))*p_amount*0.02*(1.0+p_wobble*sin(uTime*3.0));
  vec4 A=IN(toUV(q+d)),B=IN(vUv),C=IN(toUV(q-d)); return vec4(A.r,B.g,C.b,max(max(A.a,B.a),C.a));}`},
psycolor:{kind:'fx',name:'Pszichedelikus színezés',desc:'A fényerőt végigfuttatja a palettán.',usesPal:true,main:['amount','cycles','speed'],
 params:[S('amount','Erősség',0,1,.8),S('cycles','Ciklusok',.2,6,2),S('speed','Sebesség',-4,4,1)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); float l=luma(u); vec3 m=pal(l*p_cycles+uTime*p_speed*0.1)*smoothstep(0.0,0.08,l); return vec4(mix(u,m,p_amount)*c.a,c.a);}`},
grade:{kind:'fx',name:'Színkorrekció',desc:'Árnyalat, telítettség, kontraszt, fényerő.',main:['sat','contrast','bright'],
 params:[S('sat','Telítettség',0,3,1.2),S('contrast','Kontraszt',0,3,1.1),S('bright','Fényerő',0,3,1),S('hshift','Árnyalat',-.5,.5,0),S('invert','Invertálás',0,1,0)],
 code:`vec4 fx(){vec4 s=IN(vUv); vec3 c=hueShift(unp(s),p_hshift); c=mix(vec3(luma(c)),c,p_sat); c=(c-0.5)*p_contrast+0.5; c*=p_bright; c=mix(c,1.0-c,p_invert); return vec4(max(c,0.0)*s.a,s.a);}`},
glitch:{kind:'fx',name:'Glitch',desc:'Sávos elcsúszás, RGB-szakadás, pixelesítés.',main:['amount','rate','pixel'],
 params:[S('amount','Erősség',0,3,.6),S('rate','Gyakoriság',0,4,1),S('pixel','Pixelméret',0,64,0,1),S('blocks','Sávméret',.2,4,1)],
 code:`vec4 fx(){vec2 uv=vUv; float t=floor(uTime*p_rate*8.0); float row=floor(uv.y*p_blocks*20.0);
  if(hash(vec2(row,t))>1.0-p_amount*0.3) uv.x+=(hash(vec2(t,row))-0.5)*0.2*p_amount;
  if(p_pixel>=1.0){vec2 ps=vec2(p_pixel)/uRes; uv=floor(uv/ps)*ps+ps*0.5;}
  float sh=p_amount*0.01*(hash(vec2(t,3.0))-0.5)*4.0; vec4 A=IN(fract(uv+vec2(sh,0.0))),B=IN(fract(uv)),C=IN(fract(uv-vec2(sh,0.0)));
  return vec4(A.r,B.g,C.b,max(max(A.a,B.a),C.a));}`},
film:{kind:'fx',name:'Film és szemcse',desc:'Filmszemcse, képsorok, vignetta.',main:['grain','vig','scan'],
 params:[S('grain','Szemcse',0,2,.5),S('vig','Vignetta',0,2,.8),S('scan','Képsorok',0,1,.3)],
 code:`vec4 fx(){vec4 s=IN(vUv); vec3 c=s.rgb; c+=(hash(floor(vUv*uRes)+fract(uTime*7.0)*100.0)-0.5)*p_grain*0.25*s.a;
  c*=1.0-p_scan*0.35*(0.5+0.5*sin(vUv.y*uRes.y*1.5)); vec2 q=vUv-0.5; c*=1.0-p_vig*dot(q,q)*2.2; return vec4(max(c,0.0),s.a);}`},
texture:{kind:'fx',name:'Textúra',desc:'Anyagszerűség a képen: papír, vászon, por és karcok, kőzet vagy finom zaj. Ettől lesz a kép tapintható.',main:['mode','amount','scale'],
 params:[SEL('mode','Anyag',['Papír','Vászon','Por és karcok','Kőzet','Finom zaj'],0),S('amount','Erősség',0,1,.35),S('scale','Lépték',.3,4,1),S('anim','Mozgás',0,1,0)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); vec2 q=(vUv-0.5)*ASP()*p_scale; float tm=floor(uTime*12.0*p_anim); float tx=0.5;
  if(p_mode<0.5) tx=fbm(q*40.0)*0.6+fbm(q*vec2(220.0,40.0))*0.4;
  else if(p_mode<1.5){vec2 w=q*180.0; tx=0.5+0.25*(sin(w.x)*sin(w.y*0.5+sin(w.x*0.5)))+(fbm(q*30.0)-0.5)*0.4;}
  else if(p_mode<2.5){float dd=step(0.996,hash(floor(q*300.0)+tm)); float sc=step(0.9985,hash(vec2(floor(q.x*900.0+tm*13.0),tm)))*fbm(vec2(q.y*3.0,tm)); tx=0.5+dd*0.5-sc*0.6+(fbm(q*60.0+tm)-0.5)*0.2;}
  else if(p_mode<3.5) tx=fbm(q*8.0+fbm(q*16.0)*2.0);
  else tx=hash(floor(vUv*uRes)+tm*7.13);
  vec3 r=u*(1.0+(tx-0.5)*2.0*p_amount); return vec4(max(r,0.0)*c.a,c.a);}`},
blob:{kind:'fx',name:'Blob-követés',blob:true,usesPal:true,desc:'Megkeresi és követi a fényes, sötét, mozgó vagy színes foltokat az alatta lévő képen, és HUD-jelölőkkel, vonalakkal, feliratokkal rajzolja meg őket. Rétegre húzva csak azt az egy réteget követi.',
 groups:[{t:'Követés',open:true,keys:['source','detect','thresh','count','spacing','minarea','res','smooth','persist','wander']},
  {t:'Jelölők',open:true,keys:['style','color','colormode','sizemode','box','sizemul','width','fill','dash','guides','jitter','flicker']},
  {t:'Összekötés',open:true,keys:['link','nearest','linkdist','curve','linkalpha']},
  {t:'Feliratok',open:false,text:true,keys:['label','fsize','font','tag','scramble']},
  {t:'Hatás a dobozokon belül',open:false,keys:['inside','inamt','pix']}],
 params:[SEL('source','Mit kövessen',['Fényesség','Sötétség','Mozgás','Színesség','Véletlen pontok'],0),SEL('detect','Észlelés',['Foltok','Csúcspontok'],1),
  S('thresh','Küszöb',0,1,.55),S('count','Darabszám',1,60,14,1),S('spacing','Pontok távolsága',1,30,6,1),S('minarea','Min. foltméret',1,200,4,1),S('res','Észlelési felbontás',48,256,128,16),
  S('smooth','Simítás',0,.98,.6),S('persist','Kitartás (képkocka)',0,60,8,1),S('wander','Véletlen mozgás',0,3,1),
  SEL('style','Jelölő',['Keret','Sarkok','Kör','Célkereszt','Pont','Rombusz','Nincs'],0),COL('color','Szín','#ffffff'),SEL('colormode','Színezés',['Egyszínű','Paletta','Színváltó'],0),
  SEL('sizemode','Méret',['Folt szerint','Fix'],1),S('box','Dobozméret',.01,.5,.07),S('sizemul','Méretszorzó',.5,3,1.2),S('width','Vonalvastagság',.5,6,1.5),S('fill','Kitöltés',0,1,0),
  SEL('dash','Vonal',['Folytonos','Szaggatott'],0),SEL('guides','Vezetővonalak',['Ki','Be'],0),S('jitter','Remegés',0,1,0),S('flicker','Villogás',0,1,0),
  SEL('link','Összekötés',['Nincs','Lánc','Legközelebbi','Hálózat','Középpontba'],2),S('nearest','Szomszédok száma',1,5,1,1),S('linkdist','Hálózat távolsága',.05,1,.3),S('curve','Görbület',-1,1,0),S('linkalpha','Vonalak erőssége',0,1,.6),
  SEL('label','Felirat',['Nincs','Azonosító','Koordináták','Pixel','Méret','Hex','Saját sablon','ID + koordináta'],7),S('fsize','Betűméret',4,40,11),SEL('font','Betűtípus',['Mono','Sans','Orbitron','Major Mono'],0),SEL('tag','Stílus',['Szöveg','Címke'],0),S('scramble','Karakterkeverés',0,1,0),
  SEL('inside','Hatás',['Nincs','Invertálás','Pixelesítés','Hőkamera','Színfordítás','Fekete-fehér','Kiemelés','Elmosás'],0),S('inamt','Erősség',0,1,1),S('pix','Pixel / elmosás mérete',2,40,10)],
 code:`vec3 thermal(float x){return clamp(vec3(-0.5+3.0*x,-1.5+3.0*x,1.0-abs(x*3.0-1.0)+max(0.0,x*3.0-2.5)*2.0),0.0,1.0);}
vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); float m=texture(uPrev,vUv).a*p_inamt; vec3 e=u;
  if(p_inside<0.5) e=u;
  else if(p_inside<1.5) e=1.0-u;
  else if(p_inside<2.5){vec2 ps=vec2(max(p_pix,1.0))/uRes; e=unp(IN(floor(vUv/ps)*ps+ps*0.5));}
  else if(p_inside<3.5) e=thermal(luma(u));
  else if(p_inside<4.5) e=hueShift(u,0.5);
  else if(p_inside<5.5) e=vec3(step(0.5,luma(u)));
  else if(p_inside<6.5) e=u*1.8+0.08;
  else {vec4 acc=vec4(0.0); for(int i=-2;i<=2;i++){for(int j=-2;j<=2;j++){acc+=IN(vUv+vec2(float(i),float(j))*p_pix*0.6/uRes);}} e=unp(acc/25.0);}
  float ca=max(c.a,m*step(0.5,p_inside)); vec3 base=mix(u,e,m)*ca; vec4 ov=texture(uImage,vUv);
  return vec4(ov.rgb*ov.a+base*(1.0-ov.a),ov.a+ca*(1.0-ov.a));}`},

/* ================= Item ops ================= */
function insertItem(obj,refId){
  const r=refId?findItem(refId):(selId?findItem(selId):null);
  if(!r)st.layers.push(obj);
  else if(r.it.type==='group'&&obj.type!=='group'&&r.it.open)r.it.children.push(obj);
  else if(obj.type==='group'&&r.parent){const pr=findItem(r.parent.id);pr.list.splice(pr.i+1,0,obj);}
  else r.list.splice(r.i+1,0,obj);
  selId=obj.id;}
function addFromLib(c,i,refId){const it=LIB[c][i].make();insertItem(it,refId);commit();renderAll();toast(`Hozzáadva: ${it.name}`);if(it.type==='image')$('#fileImg').click();}

  if(rs()<.25+.55*ax.light){const L=makeLayer('glow');L.p.amount.v=.4+ax.light*.9;L.p.thresh.v=.25+.3*rs();L.p.radius.v=1+rs()*2;after.push(L);tgs.push([L,{speed:[],intens:['amount'],chaos:[]}]);}
  if(rs()<.1+.6*ax.cosmic*ax.light)after.push(makeLayer('radial',{p:{amount:.5+rs()*.6,length:.8+rs()}}));
  if(rs()<.12+.45*ax.organic)after.push(makeLayer('texture',{p:{mode:ax.tech>.6?4:[0,1,3][Math.floor(rs()*3)],amount:.12+.25*rs()}}));
  if(rs()<.3)after.push(makeLayer('grade',{p:{sat:.8+.6*ax.energy,contrast:1+.2*rs()}}));
  if(rs()<.1+.5*ax.chaos*ax.energy)after.push(makeLayer('chroma',{p:{amount:.4+rs()}}));
  const life=[...base,...focal.filter(l=>!l.maskOnly)];
  if(life.length&&rs()<.3+.6*ax.energy){const L=life[Math.floor(rs()*life.length)];if(rs()<.5)L.n.hue={v:L.n.hue.v,a:.1+.2*rs(),f:.02+.08*rs(),w:0};else L.n.opacity={v:L.n.opacity.v,a:.15+.2*rs(),f:.05+.2*rs(),w:0};}
  let layers=[...base,...before,...focal,...after];
  const g0=()=>layers.reduce((s,l)=>s+itemCost(l),0);
  while(g0()>24&&after.length){const x=after.pop();layers=layers.filter(l=>l!==x);}
  const dev=AXES.map(([k])=>[k,ax[k]-.5]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const adj=([k,d])=>{const l=ADJ[k][d>=0?0:1];return l[Math.floor(rs()*l.length)];};
  const title=`${adj(dev[0])} ${adj(dev[1]).toLowerCase()} ${NOUNS[Math.floor(rs()*NOUNS.length)]}`;
  const g=makeGroup(title,layers,{open:false});
  const mkM=(l,cat)=>{const t=[];for(const [L,tg] of tgs){if(!layers.includes(L))continue;for(const k of tg[cat]){const pd=EFFECTS[L.type].params.find(p=>p.k===k);const cur=L.p[k].v;t.push([L.id,'p.'+k,0,Math.abs(cur)<.01?pd.max*.5:cur*2]);}}return t.length?{l,t:t.slice(0,12),v:.5}:null;};
  g.macros=[mkM('Tempó','speed'),mkM('Fény','intens'),mkM('Káosz','chaos'),sizeT.length?{l:'Méret',t:sizeT,v:.5}:null].filter(Boolean);
  for(const m of g.macros)m.v=macroRead(g,m);
  const look=mkLook(pickW(rs,LOOK_AFF,ax).n);const lp=look.p;
  lp.temp.v=Math.max(-1,Math.min(1,lp.temp.v+(ax.warm-.5)*.6));lp.sat.v=Math.max(0,Math.min(1.8,lp.sat.v*(.85+.35*ax.energy)));lp.bloom.v=Math.min(2,lp.bloom.v*(.6+ax.light*.9));lp.exposure.v+=(ax.light-.5)*.5;look.preset='Generált';
  return {group:g,look,bg:toHex(palJS(main,.02).map(x=>x*.1)),title};}

  selId=r.group.id;resetFeedback();commit();renderAll();updLookLbl();saveRnd();toast(`${r.title} · #${RND.seed}${RND.variant?'.'+RND.variant:''}`);

    det('Mi kerülhet bele',false,sw('3D testek','d3'),sw('Formák és maszkok','shapes'),sw('Visszhang (feedback)','feedback'),sw('Stilizálás (ASCII, pixel, raszter, glitch)','style'),sw('Blob-követés','track')),
    ctlSelect(modeObj,SEL('mode','Eredmény',['Új jelenet','Hozzáadás rétegként'],0)),
    h('div',{class:'row2'},h('span',null,'Mag'),seedIn),
    h('div',{class:'btnrow',style:'justify-content:flex-end'},h('button',{class:'btn',title:'Ugyanaz a felépítés, más paraméterekkel',onclick:()=>{RND.variant++;runRandom(false);}},'Variáció'),h('button',{class:'btn accent',onclick:()=>runRandom(true)},'Generálás  (R)'))));}

  const im=new Image();im.onload=()=>{const sc=Math.min(1,2048/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const id='A'+Date.now().toString(36);assets[id]=c.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.9);imgTex.set(id,{tex:texFromCanvas(c),w:c.width,h:c.height});

/* ================= Keyboard ================= */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  if(e.key==='Escape'){closePop();return;}
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  const mod=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();dupSel();return;}
  if(mod&&k==='g'){e.preventDefault();groupSel();return;}
  if(mod)return;
  if(e.key===' '){e.preventDefault();setPlay(!playing);}
  else if(k==='v')setTool('move');else if(k==='o')setTool('orbit');else if(k==='r')runRandom(true);
  else if(k==='g')$('#gizmoBtn').click();else if(k==='f')toggleFS();
  else if(k==='h'){const L=sel();if(L){L.vis=!L.vis;commit();renderLayers();}}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel();}
  else if(e.key===']')moveSel(1);else if(e.key==='[')moveSel(-1);
  else if(e.key==='Home'){time=0;resetFeedback();audioRestart();}
  markDirty();
});

/* ================= Boot ================= */
(function boot(){
  let ok=false;
  try{const a=localStorage.getItem('latomas2.auto');if(a){const o=JSON.parse(a);Object.assign(assets,o.assets||{});for(const id in assets)loadAsset(id);
    st.layers=(o.state.layers||[]).filter(l=>l.type==='group'||EFFECTS[l.type]).map(normalize);st.bg=o.state.bg||st.bg;st.size=o.state.size||st.size;st.look=normLook(o.state.look);setTL(o.state);ok=st.layers.length>0;}}catch(_){}
  if(!ok)st.layers=[makeRecipe(RECIPES[0])];
  selId=(st.layers[st.layers.length-1]||{}).id||null;
  resizeMain();renderAll();commit();buildCats();buildShelf();setPlay(true);updLookLbl();
  requestAnimationFrame(t=>{last=t;frame(t);});
  const keys=Object.keys(EFFECTS).filter(k=>k!=='custom');let ki=0;
  const idle=window.requestIdleCallback||((f)=>setTimeout(()=>f({timeRemaining:()=>8}),120));
  const warm=dl=>{while(ki<keys.length&&dl.timeRemaining()>6){try{getProg({type:keys[ki]});}catch(_){}ki++;}if(ki<keys.length)idle(warm);};
  setTimeout(()=>idle(warm),2500);
})();
