<title>Látomás Stúdió</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Unbounded:wght@300;700&family=Syne:wght@500;800&family=Orbitron:wght@500;800&family=Major+Mono+Display&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Instrument+Sans:wght@400;600;700&family=Bricolage+Grotesque:wght@400;700;800&family=Fraunces:wght@400;700&display=swap">
<style>
/* Layout: lebegő, lekerekített panelek egy sötét műhelyben — bal: rétegfa, közép: vászon lebegő eszköz-HUD-dal, jobb: inspector, alul: könyvtár-polc. Apple Pro-alkalmazás érzet: rendszerbetű, finom elválasztók, szegmentált vezérlők, kevés de nagy kontroll. */
:root{
  color-scheme:dark;
  --bg:#111113; --stage:#0a0a0c; --chrome:rgba(30,30,33,.82); --side:#1c1c1f; --card:#2a2a2e; --hover:rgba(255,255,255,.06);
  --sep:rgba(255,255,255,.08); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.14); --seg-on:#5b5b60;
  --fg:#f5f5f7; --fg2:#a1a1a8; --fg3:#68686f; --accent:#7472f5; --accent-soft:rgba(116,114,245,.22); --on-accent:#fff;
  --danger:#ff5a50; --ok:#30d158; --thumb:#ffffff; --shadow:0 12px 40px rgba(0,0,0,.45);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --fm:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9e9ee; --stage:#d4d4da; --chrome:rgba(248,248,250,.85); --side:#f6f6f8; --card:#ffffff; --hover:rgba(0,0,0,.04);
  --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.09); --seg-on:#ffffff;
  --fg:#1d1d1f; --fg2:#6b6b72; --fg3:#a3a3aa; --accent:#5856d6; --accent-soft:rgba(88,86,214,.14); --on-accent:#fff;
  --danger:#e5372c; --ok:#1f9d48; --shadow:0 12px 40px rgba(0,0,0,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e9e9ee; --stage:#d4d4da; --chrome:rgba(248,248,250,.85); --side:#f6f6f8; --card:#ffffff; --hover:rgba(0,0,0,.04);
  --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.09); --seg-on:#ffffff;
  --fg:#1d1d1f; --fg2:#6b6b72; --fg3:#a3a3aa; --accent:#5856d6; --accent-soft:rgba(88,86,214,.14); --on-accent:#fff;
  --danger:#e5372c; --ok:#1f9d48; --shadow:0 12px 40px rgba(0,0,0,.14); color-scheme:light}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}

#app{height:100%;display:grid;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:236px minmax(0,1fr) 296px;grid-template-rows:48px minmax(0,1fr) 176px;
  grid-template-areas:"bar bar bar" "layers stage insp" "layers shelf insp"}
.panel{background:var(--side);border:1px solid var(--sep);border-radius:14px;min-width:0;min-height:0;overflow:hidden}

/* ----- top bar ----- */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;background:var(--chrome);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 200deg,#ff9f0a,#ff375f,#bf5af2,#5e5ce6,#64d2ff,#30d158,#ff9f0a);box-shadow:inset 0 0 0 4px var(--side)}
.grow{flex:1}
.transport{display:flex;align-items:center;gap:2px;background:var(--fill2);border-radius:9px;padding:2px}
.time{font:500 12px var(--fm);font-variant-numeric:tabular-nums;color:var(--fg2);min-width:64px;text-align:center}
.ib{width:30px;height:28px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.ib.rec{color:var(--danger)}
.ib.rec.on{background:var(--danger);color:#fff}
.ib[disabled]{opacity:.35;cursor:default}
.pill{height:28px;border:0;border-radius:8px;padding:0 11px;background:var(--fill);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{filter:brightness(1.15)}
.pill.accent{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ----- layers ----- */
.layers{grid-area:layers;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;font-weight:600;font-size:13px}
.ltree{list-style:none;margin:0;padding:2px 6px 8px;overflow:auto;flex:1}
.lr{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border-radius:7px;cursor:default;user-select:none;position:relative}
.lr:hover{background:var(--hover)}
.lr.sel{background:var(--accent);color:var(--on-accent)}
.lr.sel .lk,.lr.sel .eye{color:inherit;opacity:.85}
.lr.off .ln{opacity:.4}
.lr.drop-in{box-shadow:inset 0 0 0 2px var(--accent)}
.lr.drop-above::before{content:"";position:absolute;left:6px;right:6px;top:-1px;height:2px;border-radius:1px;background:var(--accent)}
.chev{width:14px;height:14px;border:0;background:none;padding:0;color:var(--fg3);transition:transform .15s;flex:none}
.chev.open{transform:rotate(90deg)}
.lr.sel .chev{color:inherit}
.lr .clip{width:14px;color:var(--fg3);font-size:12px;line-height:1;flex:none;text-align:center}
.lr.sel .clip{color:inherit}
.lic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--fill2);color:var(--fg2)}
.lr.sel .lic{background:rgba(255,255,255,.22);color:#fff}
.lic svg{width:14px;height:14px}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{font-size:10.5px;color:var(--fg3)}
.eye{width:22px;height:22px;border:0;background:none;border-radius:5px;display:grid;place-items:center;color:var(--fg3);opacity:0;flex:none}
.lr:hover .eye,.lr.off .eye,.eye:focus-visible{opacity:1}
.eye svg{width:14px;height:14px}
.lfoot{display:flex;gap:2px;padding:6px;border-top:1px solid var(--sep)}
.lfoot .ib{flex:1;height:26px}
.lempty{color:var(--fg3);padding:12px;font-size:12px}

/* ----- stage ----- */
.stage{grid-area:stage;position:relative;background:var(--stage);display:flex}
.wrap{flex:1;position:relative;min-width:0;display:grid;place-items:center;touch-action:none;overflow:hidden}
#cv{display:block;box-shadow:0 0 0 1px var(--sep),var(--shadow);background:#000}
.hudbar{position:absolute;left:12px;top:12px;display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);z-index:3}
.hudbar .ib{width:32px;height:30px}
.hudbar .ib[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.ib.hint3d:not([aria-pressed=true]){box-shadow:0 0 0 2px var(--accent) inset;animation:hint3d 1.6s ease-in-out 3}
@keyframes hint3d{50%{box-shadow:0 0 0 2px var(--accent) inset,0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.ib.hint3d{animation:none}}
.tipbox{display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:9px;background:var(--accent-soft);font-size:12px;color:var(--fg);line-height:1.45}
.tipbox b{font-weight:600}
.hudbar .sepv{width:1px;background:var(--sep);margin:4px 3px}
.gizmo{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
.gizmo .ring{position:absolute;left:0;top:0;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.gizmo .h{position:absolute;width:14px;height:14px;transform:translate(-50%,-50%);background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4);pointer-events:auto;touch-action:none}
.gizmo .h.s{border-radius:3px;cursor:nwse-resize}
.gizmo .h.r{cursor:grab;background:var(--accent)}
.gizmo .stem{position:absolute;width:1.5px;background:rgba(255,255,255,.85);transform-origin:50% 100%}
.gizmo .dot{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.audition{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:3;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hud{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:7px;font:11px var(--fm);color:var(--fg2);background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);border-radius:999px;padding:5px 11px;z-index:3;cursor:help;max-width:calc(100% - 200px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud i{width:7px;height:7px;border-radius:50%;flex:none}
.errdot{width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font:700 11px/16px var(--f);text-align:center;flex:none}
.errbox{margin:0 14px 10px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--fg);font-size:12px}
.errbox pre{margin:6px 0 0;font:10.5px/1.4 var(--fm);white-space:pre-wrap;max-height:140px;overflow:auto;color:var(--fg2)}
.cost{display:flex;gap:1.5px;align-items:flex-end;height:10px;flex:none;color:var(--fg3)}
.cost i{width:2.5px;border-radius:1px;background:currentColor}
.lr.sel .cost{color:inherit;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:11px;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);z-index:3}
.tl .ib{width:28px;height:26px}.tl .ib[aria-pressed=true]{color:var(--accent)}
.tl-track{flex:1;position:relative;height:22px;border-radius:6px;background:var(--fill2);cursor:pointer;touch-action:none;overflow:hidden;min-width:0}
.tl-segs{position:absolute;inset:0}
.tl-seg{position:absolute;top:5px;height:12px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent)}
.tl-seg.out{background:transparent;border-style:dashed}
.tlx{position:absolute;left:12px;right:12px;bottom:52px;max-height:44%;overflow:auto;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--sep);border-radius:11px;z-index:3;font-size:11.5px}
#tlxBody{position:relative;min-width:420px}
.tlx-row{display:grid;grid-template-columns:150px 1fr;align-items:stretch;height:24px;border-bottom:1px solid var(--sep)}
.tlx-row.sel{background:var(--fill2)}.tlx-row.off .tlx-lane{opacity:.4}
.tlx-ruler{position:sticky;top:0;z-index:2;background:var(--chrome);height:20px}
.tlx-name{padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--fg2);border-right:1px solid var(--sep);min-width:0}
.tlx-ruler .tlx-name{cursor:default;color:var(--fg3);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.tlx-row.sel .tlx-name{color:var(--fg);font-weight:600}
.tlx-name.cam{color:var(--accent);font-weight:600}
.tlx-lane{position:relative;cursor:pointer;touch-action:none;margin:0 8px}
.tlx-tick{position:absolute;top:4px;transform:translateX(-50%);font:10px var(--fm);color:var(--fg3);pointer-events:none;white-space:nowrap}
.tlx-seg{position:absolute;top:6px;height:12px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);cursor:ew-resize;touch-action:none}
.tlx-seg.out{background:transparent;border-style:dashed}.tlx-seg.morph{background:transparent;border-style:dotted}
.tlx-key{position:absolute;top:7px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--accent);border:1.5px solid var(--side);border-radius:2px;cursor:ew-resize;touch-action:none;z-index:1}
.tlx-key.on{background:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.tlx-zb{border:0;background:var(--fill2);color:var(--fg2);width:18px;height:16px;border-radius:4px;font:600 11px/16px var(--f);padding:0;margin-left:4px;flex:none}
.tlx-zb:hover{color:var(--fg)}.tlx-ruler .tlx-name span{flex:1}.tlx-ruler .tlx-lane{cursor:text}
.tlx-marq{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none;z-index:4;border-radius:3px}
.tlx-scroll{position:sticky;bottom:0;left:0;height:6px;margin:2px 8px 4px 158px;background:var(--fill2);border-radius:3px;cursor:pointer}
.tlx-scroll i{position:absolute;top:0;bottom:0;background:var(--fg3);border-radius:3px}
.tlx-ph{position:absolute;top:0;bottom:0;left:calc(158px + var(--f,0)*(100% - 166px));width:1.5px;background:var(--fg);pointer-events:none;z-index:3;display:block}
.tl-beat{position:absolute;top:0;bottom:0;width:1px;background:var(--sep)}
.tl-head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none}
.tl .val{width:44px}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sigchip{position:relative;overflow:hidden;border:0;border-radius:8px;padding:7px 9px;background:var(--fill2);font-size:12px;cursor:grab;text-align:left;white-space:nowrap;text-overflow:ellipsis}
.sigchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:calc(var(--lv,0)*100%)}
.ctl.sigdrop{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px}
.chip{border:0;border-radius:999px;padding:5px 11px;background:var(--fill2);font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.popover.wide{min-width:340px;max-width:min(390px,calc(100vw - 32px))}
.axhint{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);margin-top:-2px}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.drophint{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;pointer-events:none;z-index:4}

/* ----- shelf ----- */
.shelf{grid-area:shelf;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:12px;padding:10px 12px 6px;flex-wrap:wrap}
.shead .hint{color:var(--fg3);font-size:11.5px;margin-left:auto}
.seg{display:inline-flex;background:var(--fill2);border-radius:8px;padding:2px;gap:1px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;font-size:12px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.items{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 12px 10px;flex:1;align-items:flex-start}
.items .item{flex:0 0 128px;width:128px}
.shsep{flex:0 0 auto;align-self:stretch;max-height:104px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);border-right:1px solid var(--sep);padding:0 0 0 6px;margin:0 2px;text-align:center}
.item{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--fg)}
.item canvas{width:128px;height:80px;border-radius:9px;background:#000;box-shadow:0 0 0 1px var(--sep)}
.item:hover canvas,.item:focus-visible canvas{box-shadow:0 0 0 2px var(--accent)}
.item span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ----- inspector ----- */
.insp{grid-area:insp;display:flex;flex-direction:column}
.ibody{overflow:auto;flex:1;padding:0 0 16px}
.ihead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.ihead .lic{width:34px;height:34px;border-radius:9px}
.ihead .lic svg{width:18px;height:18px}
.ihead .tt{flex:1;min-width:0}
.ihead input{width:100%;border:0;background:none;font-weight:600;font-size:15px;padding:1px 3px;margin-left:-3px;border-radius:5px}
.ihead input:hover,.ihead input:focus{background:var(--fill2)}
.ihead small{display:block;color:var(--fg2);font-size:11.5px}
.desc{padding:0 14px 10px;color:var(--fg2);font-size:12px;margin:0}
.sec{border-top:1px solid var(--sep);padding:0 14px}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--fg3);border-bottom:1.5px solid var(--fg3);transform:rotate(-45deg);transition:transform .15s;margin-right:3px}
.sec[open]>summary::after{transform:rotate(45deg)}
.sec .content{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2)}
.ctl .top .lab{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ctl .top .lab .ad{width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.ctl.anim .top .lab .ad{display:block}
.val{font:12px var(--fm);font-variant-numeric:tabular-nums;color:var(--fg);border:0;background:none;width:58px;text-align:right;padding:1px 3px;border-radius:4px}
.val:hover,.val:focus{background:var(--fill2)}
.anb{width:20px;height:20px;border:0;border-radius:5px;background:none;color:var(--fg3);display:grid;place-items:center;opacity:0}
.ctl:hover .anb,.ctl.anim .anb,.anb:focus-visible{opacity:1}
.ctl.anim .anb{color:var(--accent)}
.anb svg{width:13px;height:13px}
.kb{width:20px;height:20px;border:0;border-radius:5px;background:none;color:var(--fg3);display:grid;place-items:center;opacity:0;flex:0 0 auto;padding:0}
.kb svg{width:12px;height:12px}
.ctl:hover .kb,.ctl.keyed .kb,.kb:focus-visible,.scrub:hover .kb,.kb[data-k=has],.kb[data-k=on]{opacity:1}
.kb[data-k=has]{color:var(--accent)}
.kb[data-k=on]{color:var(--accent)}.kb[data-k=on] svg path{fill:currentColor}
.ctl:not(.keyed) .kgr{display:none}
.ked{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border-radius:9px;background:var(--fill2);margin-top:4px}
.kgraph{width:100%;height:86px;display:block;overflow:visible;background:var(--fill);border-radius:6px}
.kg-line{fill:none;stroke:var(--accent);stroke-width:1.8}.kg-mid{stroke:var(--sep);stroke-dasharray:3 3}.kg-ph{stroke:var(--fg2);stroke-width:1}
.kg-key{fill:var(--side);stroke:var(--accent);stroke-width:1.6;cursor:pointer}.kg-key.on{fill:var(--accent)}
.kinfo{display:flex;flex-direction:column;gap:8px}.krow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kfield{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg3)}.knum{width:100%;min-width:0;border:0;border-radius:6px;background:var(--fill);padding:4px 6px;font:12px var(--fm);color:var(--fg)}
.bezw{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.bez{width:132px;height:132px;touch-action:none;cursor:crosshair}
.bz-box{fill:var(--fill);stroke:var(--sep)}.bz-arm{stroke:var(--fg3);stroke-width:1}.bz-c{fill:none;stroke:var(--accent);stroke-width:2}.bz-h{fill:var(--side);stroke:var(--accent);stroke-width:2}
.kcurves{display:flex;flex-direction:column;gap:6px}
.chip[aria-pressed=true]{outline:2px solid var(--accent)}

  float sm=it-log2(max(log2(max(m,1.0001)),0.0001))+4.0; float inside=step(p_iter-0.5,it);
  return vec4(pal(sm*0.02*p_bands+t*0.3)*(1.0-inside)+inside*pal(0.9)*0.15*p_core,1.0);}`},
moire:{kind:'gen',name:'Interferencia',desc:'Mozgó hullámforrások moaré-mintázata.',main:['speed','freq','sharp'],
 params:[S('speed','Sebesség',0,3,.6),S('sep','Forrástávolság',0,1,.25),S('freq','Frekvencia',1,40,10),S('sharp','Kontraszt',.1,4,.8)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed;
  vec2 c1=vec2(cos(t*0.3),sin(t*0.4))*p_sep; vec2 c2=vec2(cos(t*0.23+2.0),sin(t*0.37+1.0))*p_sep; float f=p_freq*TAU;
  float v=(sin(length(p-c1)*f)+sin(length(p-c2)*f)+sin(length(p)*f*0.5-t*2.0))/3.0;
  return vec4(pal(v*0.4+t*0.05)*pow(abs(v),p_sharp)*1.4,1.0);}`},
hyper:{kind:'gen',name:'Hipertér',desc:'Fénysebességű csillagcsíkok.',main:['speed','count','streak'],
 params:[S('speed','Sebesség',0,4,1),S('count','Sűrűség',10,200,60,1),S('streak','Csíkhossz',0,3,1),S('glow','Fény',0,3,1.3)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed; float r=length(p); float a=atan(p.y,p.x)/TAU+0.5; vec3 col=vec3(0.0);
  for(int L=0;L<3;L++){float fl=float(L); float n=floor(p_count*(1.0+fl*0.7)); float aa=a*n+fl*0.37; float id=floor(aa); float h=hash(vec2(id,fl*7.1));
    float z=fract(h*13.7+t*(0.25+h*0.5)); float pos=z*z*1.6; float len=p_streak*0.4*z*z+0.01;
    float fa=abs(fract(aa)-0.5)/n*TAU*r; float wl=1.0-smoothstep(0.0,0.004+0.004*z,fa);
    float seg=step(pos-len,r)*step(r,pos)*((r-pos+len)/len); col+=pal(h*0.5+fl*0.15)*wl*seg*(0.4+z);}
  col*=p_glow; col+=pal(0.6)*exp(-r*5.0)*0.5*p_glow; return vec4(col,1.0);}`},
grid:{kind:'gen',name:'Hologramrács',desc:'Végtelen sci-fi rácsmező csíkos nappal.',main:['speed','horizon','sun'],
 params:[S('speed','Sebesség',0,4,1),S('horizon','Horizont',-.5,.8,.05),S('density','Rácssűrűség',.2,4,1),S('sun','Nap',0,2,1),S('glow','Fény',0,3,1.2)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed; float hz=p_horizon;
  vec3 col=pal(0.65)*exp(-abs(p.y-hz)*6.0)*0.5;
  vec2 sc=p-vec2(0.0,hz+0.18); float sun=1.0-smoothstep(0.27,0.28,length(sc));
  float gap=sc.y<0.0?step(fract(sc.y*20.0+t*0.3),clamp(-sc.y*3.0,0.0,0.7)):0.0;
  col+=mix(pal(0.05),pal(0.35),clamp(sc.y*2.0+0.5,0.0,1.0))*sun*(1.0-gap)*p_sun;
  float y=max(hz-p.y,0.001); float z=0.25/y; vec2 g=vec2(p.x*z,z+t*2.0)*p_density;
  vec2 gl=abs(fract(g)-0.5)/max(fwidth(g),vec2(0.0001)); float ln=1.0-min(min(gl.x,gl.y),1.0);
  float fog=exp(-z*0.12)*step(p.y,hz); col+=(pal(0.8)*ln*1.5*p_glow+pal(0.75)*0.08)*fog; return vec4(col,1.0);}`},
blackhole:{kind:'gen',name:'Eseményhorizont',desc:'Fekete lyuk akkréciós koronggal és fényelhajlással.',main:['size','lens','tilt','glow'],
 params:[S('speed','Sebesség',0,3,.5),S('size','Méret',.2,3,1.2),S('lens','Lencsehatás',0,3,1),S('tilt','Dőlés',.05,1,.25),S('glow','Fény',0,3,1.2)],
 code:`vec4 fx(){vec2 p=P(); float r=length(p); float t=uTime*p_speed; float rs=p_size*0.12;
  vec2 bp=p-p*(rs*rs*p_lens*2.0/max(dot(p,p),0.0001)); float n=fbm(bp*2.5+vec2(t*0.02,0.0)); vec3 bg=pal(n*0.8+0.2)*n*n*0.7;
  vec2 sp=bp*60.0; float h=hash(floor(sp)); bg+=step(0.985,h)*(1.0-smoothstep(0.0,0.3,length(fract(sp)-0.5)))*1.2;
  vec2 dp=vec2(p.x,p.y/max(p_tilt,0.05)); float dr=length(dp);
  float disk=smoothstep(rs*1.4,rs*1.8,dr)*(1.0-smoothstep(rs*2.6,rs*4.5,dr));
  vec2 rp=rot(t*0.5/(dr*2.0+0.15))*dp; float sw=fbm(rp*10.0); float dop=1.0+0.7*(dp.x/max(dr,0.001));
  vec3 dcol=pal(0.08+dr*0.6)*disk*(0.4+sw*1.4)*dop*p_glow;
  float shadow=smoothstep(rs*0.95,rs*1.05,r); vec3 col=bg*shadow; col+=dcol*(1.0-step(0.0,p.y)*(1.0-shadow));
  col+=pal(0.1)*exp(-abs(r-rs*1.05)/(rs*0.04))*p_glow*0.8;
  col+=pal(0.12)*exp(-abs(r-rs*1.3)/(rs*0.12))*smoothstep(-rs*0.2,rs*0.6,p.y)*0.6*p_glow;
  return vec4(col,1.0);}`},
gradient:{kind:'gen',name:'Színátmenet',desc:'Lassan vándorló háttérszín a palettából.',main:['mode','span','speed'],
 params:[SEL('mode','Típus',['Lineáris','Sugaras'],1),S('span','Terjedelem',0,3,.8),S('speed','Sebesség',0,3,.2)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed; float f=p_mode<0.5?p.x*0.5+0.5:length(p); return vec4(pal(f*p_span+t*0.05),1.0);}`},
galaxy:{kind:'gen',name:'Galaxis',desc:'Spirálkarú galaxis differenciális forgással és csillagporral (a three.js galaxis-generátor ihlette).',main:['branches','twist','density','core'],
 params:[S('branches','Karok',2,8,3,1),S('twist','Csavarodás',-3,3,1.2),S('density','Sűrűség',0,3,1),S('core','Mag fénye',0,3,1),S('speed','Forgás',0,2,.25),S('radius','Kiterjedés',.2,2,.8)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed; float R=max(p_radius,0.05); float r0=length(p)/R;
  vec2 q=rot(-t*0.3/(r0+0.3))*p/R; float a=atan(q.y,q.x); float rr=length(q);
  float ph=a*floor(p_branches)+log(rr+0.02)*p_twist*3.0;
  float armd=pow(0.5+0.5*cos(ph+fbm(q*4.0)*1.5),3.0); float fall=exp(-rr*2.2); float core=exp(-rr*12.0)*p_core;
  vec2 sp=q*90.0; float h=hash(floor(sp)); float st=step(1.0-0.06*p_density*(armd*fall*3.0+0.05),h)*(1.0-smoothstep(0.0,0.35,length(fract(sp)-0.5)));
  vec3 col=pal(rr*0.6+0.1)*(armd*fall*1.6*p_density+core*1.5)+mix(pal(0.05),pal(0.55),clamp(rr,0.0,1.0))*st*1.5+vec3(1.0)*core*0.6;
  return vec4(col,1.0);}`},
waves:{kind:'gen',name:'Részecskehullám',desc:'Perspektivikus pontmező, amely tengerként hullámzik (a three.js points/waves példa ihlette).',main:['amp','density','speed','dot'],
 params:[S('amp','Hullámzás',0,3,1),S('density','Sűrűség',.3,3,1),S('speed','Sebesség',0,3,1),S('dot','Pontméret',.1,1.5,.6),S('freq','Hullámhossz',.2,4,1.2),S('height','Kameramagasság',.3,3,1.2),S('glow','Fény',0,3,1.2)],
 code:`float hfun(vec2 x,float t){return (sin(x.x*p_freq+t)+sin(x.y*p_freq*0.8+t*1.3))*0.25*p_amp;}
vec4 fx(){vec2 p=P(); float t=uTime*p_speed; vec3 ro=vec3(0.0,p_height,0.0); vec3 rd=normalize(vec3(p.x,p.y-0.25,1.0));
  if(rd.y>-0.002) return vec4(0.0);
  float tt=-ro.y/rd.y; vec3 w=ro+rd*tt;
  for(int k=0;k<2;k++){tt=(hfun(w.xz,t)-ro.y)/rd.y; w=ro+rd*tt;}
  float sp=0.25/max(p_density,0.05); vec2 g=(floor(w.xz/sp)+0.5)*sp; float d=length(w.xz-g)/sp;
  float dv=1.0-smoothstep(p_dot*0.25,p_dot*0.25+0.06,d); float fog=exp(-tt*0.08);
  float A=clamp(dv*fog,0.0,1.0); return vec4(pal(hfun(g,t)*0.8+0.4)*A*p_glow,A);}`},
lava:{kind:'gen',name:'Lávalámpa',desc:'Lassan összeolvadó, lebegő metaball-cseppek, átlátszó háttérrel.',main:['count','size','speed','soft'],
 params:[S('count','Cseppek',2,12,7,1),S('size','Méret',.05,.4,.18),S('speed','Sebesség',0,3,1),S('soft','Lágyság',0,1,.4),S('glow','Peremfény',0,3,1)],
 code:`vec4 fx(){vec2 p=P(); float t=uTime*p_speed; float f=0.0;
  for(int i=0;i<12;i++){if(float(i)>=p_count) break; float fi=float(i);
    vec2 c=vec2(sin(fi*1.7+t*0.3*(0.5+hash(vec2(fi,1.0))))*0.6,sin(t*0.25*(0.4+hash(vec2(fi,2.0)))+fi*2.3)*0.42);
    float r=p_size*(0.6+0.8*hash(vec2(fi,3.0))); f+=r*r/max(dot(p-c,p-c),0.0001);}
  float iso=smoothstep(1.0-p_soft,1.0+p_soft*0.2+0.001,f); float rim=exp(-abs(f-1.0)*6.0)*p_glow;
  return vec4(pal(f*0.15+t*0.03)*iso+pal(0.1)*rim*0.6,clamp(iso+rim*0.5,0.0,1.0));}`},
cells:{kind:'gen',name:'Sejtszövet',desc:'Élő Voronoi-sejtek izzó határokkal — organikus sci-fi textúra.',main:['zoom','speed','glow','fill'],
 params:[S('zoom','Sejtméret',1,14,5),S('speed','Sebesség',0,3,.8),S('glow','Határfény',0,3,1.2),S('fill','Sejtkitöltés',0,2,.8),S('width','Határvastagság',.1,4,1),S('variety','Színváltozatosság',0,2,.6)],
 code:`vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
vec4 fx(){vec2 p=P()*p_zoom; float t=uTime*p_speed; vec2 i=floor(p),f=fract(p); float d1=8.0,d2=8.0; vec2 id1=vec2(0.0);
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y)); vec2 o=0.5+0.5*sin(t+TAU*h2(i+g)); vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;id1=i+g;}else if(d<d2){d2=d;}}
  d1=sqrt(d1); d2=sqrt(d2); float edge=d2-d1; float e=1.0-smoothstep(0.0,0.05*p_width,edge);
  vec3 col=pal(h2(id1).x*p_variety+t*0.05)*(0.3+0.7*(1.0-d1))*p_fill+pal(0.6+edge)*e*p_glow+pal(0.6)*exp(-edge*10.0)*0.3*p_glow;
  return vec4(col,1.0);}`},
flare:{kind:'gen',name:'Lencsefény',desc:'Fényforrás sugarakkal, anamorf csíkkal és szellemképekkel. Húzd a fényforrást oda, ahová szeretnéd.',main:['size','rays','streak','ghosts'],
 params:[S('size','Fényerő',.2,3,1),S('rays','Sugarak',0,16,6,1),S('streak','Anamorf csík',0,2,1),S('ghosts','Szellemképek',0,3,1),S('ring','Halo',0,2,.6),S('flicker','Vibrálás',0,1,.3)],
 code:`vec4 fx(){vec2 p=P(); float sz=max(p_size,0.05); float r=length(p); float a=atan(p.y,p.x);
  float fl=1.0+p_flicker*(noise(vec2(uTime*8.0,0.0))-0.5);
  float core=(exp(-r*22.0/sz)*1.6+exp(-r*5.0/sz)*0.35)*fl;
  float rays=pow(abs(cos(a*max(floor(p_rays),1.0)*0.5)),60.0)*exp(-r*3.5/sz)*step(0.5,p_rays)*fl;
  float streak=exp(-abs(p.y)*90.0/sz)*exp(-abs(p.x)*1.6/sz)*p_streak;
  float ring=exp(-abs(r-0.32*sz)*45.0/sz)*0.25*p_ring;
  vec3 col=vec3(1.0,0.96,0.9)*core+pal(0.1)*rays*0.8+pal(0.6)*streak+pal(0.35)*ring;
  vec2 ctr=toQ(vec2(0.5));
  for(int i=0;i<6;i++){float fi=float(i); vec2 gp=ctr*(0.35+fi*0.32)*1.6; float gr=sz*(0.03+0.05*hash(vec2(fi,4.0))); col+=pal(0.15+fi*0.13)*(1.0-smoothstep(gr*0.6,gr,length(p-gp)))*0.18*p_ghosts;}
  return vec4(col,clamp(max(max(col.r,col.g),col.b),0.0,1.0));}`},

text:{kind:'text',name:'Szöveg',desc:'Felirat palettás csillogással és ragyogással. Több sor is lehet (Enter), balra, középre vagy jobbra zárva.',main:['tint','glow'],
 params:[S('tint','Színezés',0,1,.7),S('glow','Ragyogás',0,3,1),S('spread','Színterjedés',0,3,.6),S('shimmer','Csillogás',0,4,1)],
 code:`vec4 fx(){vec2 p=P(); float ia=uImgSize.x/max(uImgSize.y,1.0); vec2 uv=TXUV(p,ia);

  float a=texture(uImage,clamp(uv,0.0,1.0)).a*inb; float g=0.0;
  for(int i=0;i<12;i++){float an=float(i)*2.39996; vec2 off=vec2(cos(an),sin(an))*(0.01+0.02*float(i)/12.0)*vec2(1.0/ia,1.0)*1.5; g+=texture(uImage,clamp(uv+off,0.0,1.0)).a;}
  g=g/12.0*p_glow; vec3 rgb=mix(vec3(1.0),pal(uv.x*p_spread+uTime*p_shimmer*0.2),p_tint);

image:{kind:'image',name:'Kép',desc:'Saját kép rétegként — fotó, logó, textúra.',noPal:true,main:['bright','sat'],

blur:{kind:'fx',name:'Elmosás',desc:'Lágy Gauss-elmosás. Alakzatra húzva puha szélű maszkot kapsz.',passes:2,main:['radius'],
 params:[S('radius','Erősség',0,10,2)],
 code:`vec4 fx(){vec2 dir=uPass<0.5?vec2(1.0/uRes.x,0.0):vec2(0.0,1.0/uRes.y); float r=p_radius*uRes.y*0.004;
  vec4 acc=vec4(0.0); float ws=0.0;

glow:{kind:'fx',name:'Ragyogás',desc:'Puha, kétlépcsős Gauss-ragyogás: a fényes részek szétsugároznak.',passes:2,main:['amount','radius','thresh'],
 params:[S('amount','Erősség',0,3,1),S('radius','Sugár',.2,4,1.5),S('thresh','Küszöb',0,1,.35)],
 code:`vec4 fx(){vec2 dir=uPass<0.5?vec2(1.0/uRes.x,0.0):vec2(0.0,1.0/uRes.y); float r=p_radius*uRes.y*0.006;
  vec4 acc=vec4(0.0); float ws=0.0;
  for(int i=-12;i<=12;i++){float x=float(i)/12.0; float w=exp(-x*x*3.0); vec4 sm=IN(vUv+dir*x*r*3.0);

lens:{kind:'fx',name:'Téridő-görbület',desc:'Gravitációs lencse és téridő-hullámok a réteg középpontja körül. Húzd oda, ahol hajlítani akarsz.',usesPal:true,main:['mass','ripple','hole'],
 params:[S('mass','Tömeg',0,3,1),S('ripple','Gravitációs hullám',0,3,.6),S('hole','Fekete mag',0,1.5,.8),S('ring','Gyűrűfény',0,3,.8),S('waves','Hullámsűrűség',0,4,1),S('speed','Sebesség',0,4,1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r2=max(dot(q,q),0.000001); float r=sqrt(r2); float m=p_mass*p_mass*0.04; float re=sqrt(m);
  vec2 src=q-q*(m/r2); float t=uTime*p_speed; src+=q/r*sin(r*p_waves*25.0-t*3.0)*p_ripple*0.01*exp(-r*1.5);

 params:[S('segments','Szeletek',1,24,8,1),S('spin','Pörgés',-3,3,.3),S('zoom','Nagyítás',.2,3,1),S('angle','Szög',-3.14,3.14,0),S('shift','Mintavételi eltolás',-1,1,.15)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float a=atan(q.y,q.x)+uTime*p_spin*0.2; float s=TAU/max(p_segments,1.0); a=mod(a,s); a=abs(a-s*0.5);

feedback:{kind:'fx',name:'Visszhang',desc:'Feedback-hurok: az előző képkocka nagyítva, forgatva visszaíródik — végtelen csóvák.',feedback:true,main:['decay','zoom','rot'],
 params:[S('decay','Lecsengés',0,1,.92,.005),S('zoom','Zoom',-5,5,1.2),S('rot','Forgás',-5,5,.6),S('drift','Színvándorlás',-5,5,1),S('wobble','Remegés',0,3,.3),SEL('mode','Mód',['Fényes','Keverés'],0)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec2 q=toQ(vUv); q=rot(p_rot*0.02)*q/(1.0+p_zoom*0.01);
  vec2 pv=toUV(q)+vec2(fbm(vUv*3.0+uTime*0.2)-0.5,fbm(vUv*3.0+7.0-uTime*0.2)-0.5)*p_wobble*0.01;

swirl:{kind:'fx',name:'Örvény',desc:'Spirálba csavarja a képet a középpont körül.',main:['amount','radius','speed'],

 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float k=exp(-r/max(p_radius,0.01)); q=rot(p_amount*k*3.0+uTime*p_speed*k)*q; return IN(mfr(toUV(q)));}`},
warp:{kind:'fx',name:'Organikus torzítás',desc:'Zajjal hullámoztatja a képet. Maszkra húzva élő, lélegző széleket ad.',main:['amount','scale','speed'],
 params:[S('amount','Erősség',0,3,.6),S('scale','Lépték',.2,5,1.2),S('speed','Sebesség',0,3,.4)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float t=uTime*p_speed; vec2 n=vec2(fbm(q*p_scale*3.0+t),fbm(q*p_scale*3.0+vec2(5.2,1.3)-t))-0.5; return IN(toUV(q+n*p_amount*0.12));}`},
ripple:{kind:'fx',name:'Hullámzás',desc:'Koncentrikus vagy vízszerű hullámtorzítás.',main:['amount','freq','mode'],
 params:[SEL('mode','Típus',['Sugaras','Vízfelszín'],0),S('amount','Erősség',0,4,1),S('freq','Frekvencia',.2,4,1),S('speed','Sebesség',0,4,1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q)+0.00001; float t=uTime*p_speed;
  vec2 dq=p_mode<0.5?(q/r)*sin(r*p_freq*20.0-t*3.0)*p_amount*0.02:vec2(sin(q.y*p_freq*10.0+t*2.0),sin(q.x*p_freq*10.0+t*1.7))*p_amount*0.02;
  return IN(mfr(toUV(q+dq)));}`},
radial:{kind:'fx',name:'Fénysugarak',desc:'Isteni sugarak: a fények a középpontból sugároznak ki.',main:['amount','length','thresh'],
 params:[S('amount','Erősség',0,3,1),S('length','Hossz',0,3,1.2),S('thresh','Küszöb',0,1,.3)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec2 ctr=toUV(vec2(0.0)); vec2 d=(vUv-ctr)*p_length*0.5; vec4 acc=vec4(0.0); float w=1.0;
  for(int i=0;i<32;i++){vec4 s=IN(vUv-d*float(i)/32.0); acc+=s*w*smoothstep(p_thresh,p_thresh+0.2,luma(unp(s))); w*=0.95;}
  acc=acc/14.0*p_amount; return vec4(c.rgb+acc.rgb,clamp(c.a+acc.a,0.0,1.0));}`},
edge:{kind:'fx',name:'Neon körvonal',desc:'Izzó vonalat rajzol a formák szélére. Alakzatokon és szövegen különösen szép.',usesPal:true,main:['amount','width','only'],
 params:[S('amount','Erősség',0,4,1.5),S('width','Vastagság',.5,6,1.5),S('only','Csak a vonal',0,1,0),S('speed','Színmozgás',0,3,.5)],
 code:`float edgeV(vec2 uv){vec4 c=IN(uv); return c.a*0.6+luma(c.rgb)*0.4;}
vec4 fx(){vec2 px=p_width/uRes; float gx=edgeV(vUv+vec2(px.x,0.0))-edgeV(vUv-vec2(px.x,0.0)); float gy=edgeV(vUv+vec2(0.0,px.y))-edgeV(vUv-vec2(0.0,px.y));
  float e=clamp(length(vec2(gx,gy))*2.0,0.0,1.0); vec4 c=IN(vUv)*(1.0-p_only);
  vec3 ec=pal(vUv.x*0.5+vUv.y*0.5+uTime*p_speed*0.1)*e*p_amount; return vec4(c.rgb+ec,clamp(max(c.a,e),0.0,1.0));}`},
mirror:{kind:'fx',name:'Tükör',desc:'Szimmetria: félbe, négybe vagy nyolcba tükrözve.',main:['mode'],
 params:[SEL('mode','Szimmetria',['Bal-jobb','Fent-lent','Négyes','Nyolcas'],2)],
 code:`vec4 fx(){vec2 q=toQ(vUv); if(p_mode<0.5) q.x=abs(q.x); else if(p_mode<1.5) q.y=abs(q.y); else if(p_mode<2.5) q=abs(q); else {q=abs(q); if(q.y>q.x) q=q.yx;} return IN(mfr(toUV(q)));}`},
polar:{kind:'fx',name:'Poláris tér',desc:'Az alsó képet körbe vagy alagútba hajlítja.',main:['mode','repeat','speed'],
 params:[SEL('mode','Típus',['Körbe','Alagút'],1),S('zoom','Nagyítás',.2,4,1),S('repeat','Ismétlés',1,8,2,1),S('speed','Sebesség',-3,3,.5),S('spin','Pörgés',-3,3,0)],
 code:`vec4 fx(){vec2 q=toQ(vUv); float r=length(q); float a=atan(q.y,q.x)/TAU+0.5;
  vec2 uv=p_mode<0.5?vec2(a*p_repeat+uTime*p_spin*0.05,r*p_zoom-uTime*p_speed*0.1):vec2(a*p_repeat+uTime*p_spin*0.05,0.5/max(r,0.001)*p_zoom*0.2+uTime*p_speed*0.2);
  return IN(mfr(uv));}`},
chroma:{kind:'fx',name:'Kromatikus aberráció',desc:'Szétcsúsztatott RGB-csatornák.',main:['amount','wobble'],
 params:[S('amount','Erősség',0,4,1),S('wobble','Lüktetés',0,1,.3),SEL('radial','Irány',['Vízszintes','Sugaras'],1)],
 code:`vec4 fx(){vec2 q=toQ(vUv); vec2 d=(p_radial>0.5?q*length(q):vec2(0.5,0.0))*p_amount*0.02*(1.0+p_wobble*sin(uTime*3.0));
  vec4 A=IN(toUV(q+d)),B=IN(vUv),C=IN(toUV(q-d)); return vec4(A.r,B.g,C.b,max(max(A.a,B.a),C.a));}`},
psycolor:{kind:'fx',name:'Pszichedelikus színezés',desc:'A fényerőt végigfuttatja a palettán.',usesPal:true,main:['amount','cycles','speed'],
 params:[S('amount','Erősség',0,1,.8),S('cycles','Ciklusok',.2,6,2),S('speed','Sebesség',-4,4,1)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); float l=luma(u); vec3 m=pal(l*p_cycles+uTime*p_speed*0.1)*smoothstep(0.0,0.08,l); return vec4(mix(u,m,p_amount)*c.a,c.a);}`},
grade:{kind:'fx',name:'Színkorrekció',desc:'Árnyalat, telítettség, kontraszt, fényerő.',main:['sat','contrast','bright'],
 params:[S('sat','Telítettség',0,3,1.2),S('contrast','Kontraszt',0,3,1.1),S('bright','Fényerő',0,3,1),S('hshift','Árnyalat',-.5,.5,0),S('invert','Invertálás',0,1,0)],
 code:`vec4 fx(){vec4 s=IN(vUv); vec3 c=hueShift(unp(s),p_hshift); c=mix(vec3(luma(c)),c,p_sat); c=(c-0.5)*p_contrast+0.5; c*=p_bright; c=mix(c,1.0-c,p_invert); return vec4(max(c,0.0)*s.a,s.a);}`},
glitch:{kind:'fx',name:'Glitch',desc:'Sávos elcsúszás, RGB-szakadás, pixelesítés.',main:['amount','rate','pixel'],
 params:[S('amount','Erősség',0,3,.6),S('rate','Gyakoriság',0,4,1),S('pixel','Pixelméret',0,64,0,1),S('blocks','Sávméret',.2,4,1)],
 code:`vec4 fx(){vec2 uv=vUv; float t=floor(uTime*p_rate*8.0); float row=floor(uv.y*p_blocks*20.0);
  if(hash(vec2(row,t))>1.0-p_amount*0.3) uv.x+=(hash(vec2(t,row))-0.5)*0.2*p_amount;
  if(p_pixel>=1.0){vec2 ps=vec2(p_pixel)/uRes; uv=floor(uv/ps)*ps+ps*0.5;}
  float sh=p_amount*0.01*(hash(vec2(t,3.0))-0.5)*4.0; vec4 A=IN(fract(uv+vec2(sh,0.0))),B=IN(fract(uv)),C=IN(fract(uv-vec2(sh,0.0)));
  return vec4(A.r,B.g,C.b,max(max(A.a,B.a),C.a));}`},
film:{kind:'fx',name:'Film és szemcse',desc:'Filmszemcse, képsorok, vignetta.',main:['grain','vig','scan'],
 params:[S('grain','Szemcse',0,2,.5),S('vig','Vignetta',0,2,.8),S('scan','Képsorok',0,1,.3)],
 code:`vec4 fx(){vec4 s=IN(vUv); vec3 c=s.rgb; c+=(hash(floor(vUv*uRes)+fract(uTime*7.0)*100.0)-0.5)*p_grain*0.25*s.a;
  c*=1.0-p_scan*0.35*(0.5+0.5*sin(vUv.y*uRes.y*1.5)); vec2 q=vUv-0.5; c*=1.0-p_vig*dot(q,q)*2.2; return vec4(max(c,0.0),s.a);}`},
texture:{kind:'fx',name:'Textúra',desc:'Anyagszerűség a képen: papír, vászon, por és karcok, kőzet vagy finom zaj. Ettől lesz a kép tapintható.',main:['mode','amount','scale'],
 params:[SEL('mode','Anyag',['Papír','Vászon','Por és karcok','Kőzet','Finom zaj'],0),S('amount','Erősség',0,1,.35),S('scale','Lépték',.3,4,1),S('anim','Mozgás',0,1,0)],
 code:`vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); vec2 q=(vUv-0.5)*ASP()*p_scale; float tm=floor(uTime*12.0*p_anim); float tx=0.5;
  if(p_mode<0.5) tx=fbm(q*40.0)*0.6+fbm(q*vec2(220.0,40.0))*0.4;
  else if(p_mode<1.5){vec2 w=q*180.0; tx=0.5+0.25*(sin(w.x)*sin(w.y*0.5+sin(w.x*0.5)))+(fbm(q*30.0)-0.5)*0.4;}
  else if(p_mode<2.5){float dd=step(0.996,hash(floor(q*300.0)+tm)); float sc=step(0.9985,hash(vec2(floor(q.x*900.0+tm*13.0),tm)))*fbm(vec2(q.y*3.0,tm)); tx=0.5+dd*0.5-sc*0.6+(fbm(q*60.0+tm)-0.5)*0.2;}
  else if(p_mode<3.5) tx=fbm(q*8.0+fbm(q*16.0)*2.0);
  else tx=hash(floor(vUv*uRes)+tm*7.13);
  vec3 r=u*(1.0+(tx-0.5)*2.0*p_amount); return vec4(max(r,0.0)*c.a,c.a);}`},
blob:{kind:'fx',name:'Blob-követés',blob:true,usesPal:true,desc:'Megkeresi és követi a fényes, sötét, mozgó vagy színes foltokat az alatta lévő képen, és HUD-jelölőkkel, vonalakkal, feliratokkal rajzolja meg őket. Rétegre húzva csak azt az egy réteget követi.',
 groups:[{t:'Követés',open:true,keys:['source','detect','thresh','count','spacing','minarea','res','smooth','persist','wander']},
  {t:'Jelölők',open:true,keys:['style','color','colormode','sizemode','box','sizemul','width','fill','dash','guides','jitter','flicker']},

 params:[SEL('source','Mit kövessen',['Fényesség','Sötétség','Mozgás','Színesség','Véletlen pontok'],0),SEL('detect','Észlelés',['Foltok','Csúcspontok'],1),
  S('thresh','Küszöb',0,1,.55),S('count','Darabszám',1,60,14,1),S('spacing','Pontok távolsága',1,30,6,1),S('minarea','Min. foltméret',1,200,4,1),S('res','Észlelési felbontás',48,256,128,16),

  SEL('sizemode','Méret',['Folt szerint','Fix'],1),S('box','Dobozméret',.01,.5,.07),S('sizemul','Méretszorzó',.5,3,1.2),S('width','Vonalvastagság',.5,6,1.5),S('fill','Kitöltés',0,1,0),
  SEL('dash','Vonal',['Folytonos','Szaggatott'],0),SEL('guides','Vezetővonalak',['Ki','Be'],0),S('jitter','Remegés',0,1,0),S('flicker','Villogás',0,1,0),
  SEL('link','Összekötés',['Nincs','Lánc','Legközelebbi','Hálózat','Középpontba'],2),S('nearest','Szomszédok száma',1,5,1,1),S('linkdist','Hálózat távolsága',.05,1,.3),S('curve','Görbület',-1,1,0),S('linkalpha','Vonalak erőssége',0,1,.6),
  SEL('label','Felirat',['Nincs','Azonosító','Koordináták','Pixel','Méret','Hex','Saját sablon','ID + koordináta'],7),S('fsize','Betűméret',4,40,11),SEL('font','Betűtípus',['Mono','Sans','Orbitron','Major Mono'],0),SEL('tag','Stílus',['Szöveg','Címke'],0),S('scramble','Karakterkeverés',0,1,0),
  SEL('inside','Hatás',['Nincs','Invertálás','Pixelesítés','Hőkamera','Színfordítás','Fekete-fehér','Kiemelés','Elmosás'],0),S('inamt','Erősség',0,1,1),S('pix','Pixel / elmosás mérete',2,40,10)],
 code:`vec3 thermal(float x){return clamp(vec3(-0.5+3.0*x,-1.5+3.0*x,1.0-abs(x*3.0-1.0)+max(0.0,x*3.0-2.5)*2.0),0.0,1.0);}
vec4 fx(){vec4 c=IN(vUv); vec3 u=unp(c); float m=texture(uPrev,vUv).a*p_inamt; vec3 e=u;
  if(p_inside<0.5) e=u;
  else if(p_inside<1.5) e=1.0-u;
  else if(p_inside<2.5){vec2 ps=vec2(max(p_pix,1.0))/uRes; e=unp(IN(floor(vUv/ps)*ps+ps*0.5));}
  else if(p_inside<3.5) e=thermal(luma(u));
  else if(p_inside<4.5) e=hueShift(u,0.5);
  else if(p_inside<5.5) e=vec3(step(0.5,luma(u)));
  else if(p_inside<6.5) e=u*1.8+0.08;
  else {vec4 acc=vec4(0.0); for(int i=-2;i<=2;i++){for(int j=-2;j<=2;j++){acc+=IN(vUv+vec2(float(i),float(j))*p_pix*0.6/uRes);}} e=unp(acc/25.0);}
  float ca=max(c.a,m*step(0.5,p_inside)); vec3 base=mix(u,e,m)*ca; vec4 ov=texture(uImage,vUv);
  return vec4(ov.rgb*ov.a+base*(1.0-ov.a),ov.a+ca*(1.0-ov.a));}`},
ascii:{kind:'fx',name:'ASCII',desc:'Karakterekből rakja ki az alatta lévő képet (a three.js AsciiEffect ihlette).',usesPal:true,main:['size','mode','contrast'],
 params:[S('size','Karakterméret',4,40,10),SEL('mode','Szín',['Eredeti','Paletta','Mátrix-zöld','Fehér'],0),S('contrast','Kontraszt',.5,3,1.2),SEL('invert','Irány',['Normál','Fordított'],0),S('bg','Háttérkép',0,1,0)],
 code:`vec4 fx(){float cs=max(p_size,2.0)*uRes.y/540.0; vec2 cell=vec2(cs*0.667,cs); vec2 px=vUv*uRes; vec2 ci=floor(px/cell);
  vec4 s=IN((ci+0.5)*cell/uRes); vec3 u=unp(s); float l=clamp((luma(u)*s.a-0.5)*p_contrast+0.5,0.0,1.0); if(p_invert>0.5) l=1.0-l;
  float idx=floor(min(l,0.999)*10.0); vec2 f=fract(px/cell); float g=texture(uImage,vec2((idx+f.x)/10.0,f.y)).a;
  vec3 col=p_mode<0.5?u:(p_mode<1.5?pal(l*0.8+uTime*0.02):(p_mode<2.5?vec3(0.35,1.0,0.5):vec3(1.0)));
  return vec4(col*g+u*s.a*p_bg*(1.0-g),clamp(g+s.a*p_bg*(1.0-g),0.0,1.0));}`},
halftone:{kind:'fx',name:'Féltónus',desc:'Nyomdai raszterpöttyök — színes, RGB vagy újságpapír stílusban.',main:['size','mode','angle'],
 params:[S('size','Raszterméret',3,40,9),SEL('mode','Stílus',['Színes pöttyök','RGB-raszter','Újságpapír'],0),S('angle','Szög',-3.14,3.14,.4),S('scale','Pöttyméret',.5,2,1)],
 code:`vec4 fx(){float cs=max(p_size,1.0)*uRes.y/540.0; vec3 res=vec3(0.0); float A=0.0;
  for(int k=0;k<3;k++){float ang=p_angle+float(k)*0.2618*step(0.5,p_mode)*step(p_mode,1.5);
    vec2 pr=rot(ang)*(vUv*uRes); vec2 cc=(floor(pr/cs)+0.5)*cs; vec4 sc=IN((rot(-ang)*cc)/uRes); vec3 u=unp(sc);
    float v=p_mode>0.5&&p_mode<1.5?(k==0?u.r:(k==1?u.g:u.b)):luma(u); v*=sc.a;
    float rr=sqrt(clamp(v,0.0,1.0))*cs*0.62*p_scale; float cov=1.0-smoothstep(rr-0.8,rr+0.8,length(pr-cc));
    if(p_mode<0.5){res=u*cov;A=cov;break;}
    else if(p_mode<1.5){if(k==0)res.r=cov;else if(k==1)res.g=cov;else res.b=cov;A=max(A,cov);}
    else {res=vec3(1.0-cov);A=1.0;break;}}
  return vec4(res,A);}`},
pixelart:{kind:'fx',name:'Pixel art',desc:'Retró pixelgrafika színszint-csökkentéssel és Bayer-ditheringgel.',usesPal:true,main:['size','levels','dither'],
 params:[S('size','Pixelméret',1,32,6,1),S('levels','Színszintek',2,16,5,1),S('dither','Dithering',0,1,.6),SEL('mode','Színek',['Eredeti','Paletta'],0)],
 code:`vec4 fx(){float ps=max(p_size,1.0)*uRes.y/540.0; vec2 cell=floor(vUv*uRes/ps); vec4 s=IN((cell+0.5)*ps/uRes); vec3 u=unp(s);
  const float BY[16]=float[16](0.0,8.0,2.0,10.0,12.0,4.0,14.0,6.0,3.0,11.0,1.0,9.0,15.0,7.0,13.0,5.0);
  int bi=int(mod(cell.x,4.0))+int(mod(cell.y,4.0))*4; float th=((BY[bi]+0.5)/16.0-0.5)*p_dither; float lv=max(p_levels,2.0)-1.0;
  vec3 q=floor(u*lv+0.5+th)/lv; if(p_mode>0.5){float l=floor(luma(u)*lv+0.5+th)/lv; q=pal(l*0.8);}
  return vec4(clamp(q,0.0,1.0)*s.a,s.a);}`},

planet:{kind:'gen',name:'Bolygó',usesPal:true,desc:'Bolygó-stúdió: hét bolygótípus, valódi légköri derengés, forgó felhők, éjszakai városfények, gyűrű árnyékkal. A Mag (seed) mellett a kockával új bolygót dobsz.',
 main:['ptype','seed','radius','sunang','atmo','clouds','ring'],
 params:[SEL('ptype','Típus',['Sziklás','Óceán','Gázóriás','Jég','Láva','Sivatag','Erdő'],1),S('seed','Mag',0,999,7,1),S('radius','Méret',.05,.8,.3),S('sunang','Nap iránya °',-180,180,35),S('sunh','Nap magassága',-1,1,.15),
  S('atmo','Légkör',0,2,1),COL('atmocol','Légkör színe','#5aa8ff'),S('clouds','Felhőzet',0,1,.5),S('cloudspeed','Felhők szele',0,3,.6),S('lights','Városfények',0,2,0),S('ring','Gyűrű',0,1,0),S('ringtilt','Gyűrű dőlése °',5,80,18),
  S('spin','Forgás',-2,2,.2),S('tilt','Tengelyferdeség °',-60,60,15),S('craters','Kráterek / viharok',0,1,.5),S('detail','Domborzat léptéke',.3,3,1),S('tint','Palettás színezés',0,1,0),
  SEL('part','Réteg',['Teljes bolygó','Csak felszín','Csak felhőhéj','Csak légkör','Csak gyűrű – hátsó fele','Csak gyűrű – első fele'],0)],
 lib:`float wh(float n){return fract(sin(n)*43758.5453);}
float wn3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);float n=i.x+i.y*57.0+i.z*113.0;
 return mix(mix(mix(wh(n),wh(n+1.0),f.x),mix(wh(n+57.0),wh(n+58.0),f.x),f.y),mix(mix(wh(n+113.0),wh(n+114.0),f.x),mix(wh(n+170.0),wh(n+171.0),f.x),f.y),f.z);}
float wfbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<6;i++){v+=a*wn3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return v;}
mat3 wrY(float a){float c=cos(a),s=sin(a);return mat3(c,0.0,-s,0.0,1.0,0.0,s,0.0,c);}
mat3 wrZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.0,-s,c,0.0,0.0,0.0,1.0);}`,
 code:`vec4 fx(){
  vec2 p=P(); float R=p_radius; float r=length(p); float px=1.5/(uRes.y*uScale);
  float sa=radians(p_sunang), se=p_sunh*1.2;
  vec3 Ld=normalize(vec3(cos(sa)*cos(se),sin(se),sin(sa)*cos(se)));
  vec3 so=vec3(wh(p_seed*1.31+0.5)*60.0,wh(p_seed*2.17+1.0)*60.0,wh(p_seed*0.73+2.0)*60.0);
  vec3 acol=p_atmocol; float t=uTime; int ty=int(p_ptype+0.5); int PT=int(p_part+0.5);
  vec3 col=vec3(0.0); float A=0.0;
  float rt=radians(p_ringtilt); vec3 rn=normalize(vec3(0.0,cos(rt),sin(rt)));
  float rz=-(rn.x*p.x+rn.y*p.y)/rn.z; vec3 rp=vec3(p,rz); float rd=length(rp)/max(R,0.001);
  float ringM=0.0; vec3 ringC=vec3(0.0);

    vec3 w=rp/R; float along=dot(w,Ld); float perp=length(w-Ld*along); float shd=(along<0.0&&perp<1.0)?0.12:1.0;

  float lft=(floor(bx.r*255.0+0.5)*256.0+floor(bx.g*255.0+0.5))/65535.0; float rgt=(floor(bx.b*255.0+0.5)*256.0+floor(bx.a*255.0+0.5))/65535.0;

function clampP(d,v){if(d.type==='color')return /^#[0-9a-f]{6}$/i.test(String(v))?String(v):d.def;const x=Number(v);if(!isFinite(x))return d.def;const c=Math.min(d.max,Math.max(d.min,x));return d.type==='sel'||d.step>=1?Math.round(c):c;}
function specVal(raw,d){if(raw&&typeof raw==='object'&&Array.isArray(raw.k)){const k=raw.k.filter(x=>x&&isFinite(+x.t)&&isFinite(+x.v)).slice(0,24).map(x=>({t:Math.max(0,+x.t),v:clampP(d,x.v),e:Math.min(11,Math.max(0,Math.round(+x.e||5)))})).sort((a,b)=>a.t-b.t);
    return k.length?{v:k[0].v,k}:d.def;}return clampP(d,raw);}
function buildFromSpec(sp){if(!sp||!Array.isArray(sp.layers))throw new Error('A válaszban nincs rétegleírás.');
  const kids=[];for(const l of sp.layers.slice(0,14)){const d=l&&EFFECTS[l.type];if(!d||DESC_SKIP.has(l.type))continue;
    const o={name:String(l.name||d.name).slice(0,40),blend:BLEND_IDX[l.blend]!=null?l.blend:undefined,clip:!!l.clip,maskOnly:!!l.maskOnly&&d.kind==='shape'};
    if(isFinite(+l.pal))o.pal=Math.min(PALS.length-1,Math.max(0,Math.round(+l.pal)));
    for(const b of BASE){const raw=b.k==='opacity'?l.opacity:l[b.k];if(raw!=null)o[b.k]=specVal(raw,b);}
    o.p={};for(const pd of d.params){const raw=l.p&&l.p[pd.k];if(raw!=null)o.p[pd.k]=pd.type==='sel'||pd.type==='color'?clampP(pd,raw):specVal(raw,pd);}
    if(l.text&&(l.type==='text'||l.type==='mtext')){const T=l.text;o.text={str:String(T.str||'').slice(0,200)||'Látomás',font:String(T.font||'Bricolage Grotesque'),weight:String(T.weight||'700'),track:isFinite(+T.track)?+T.track:0,align:['left','center','right'].includes(T.align)?T.align:'center',lh:1.1};}
    if(l.tm&&typeof l.tm==='object'){const T=l.tm,n=(v,a,b,df)=>isFinite(+v)?Math.min(b,Math.max(a,+v)):df;o.tm={in:Math.round(n(T.in,0,8,0)),inAt:n(T.inAt,0,600,0),inDur:n(T.inDur,.05,5,.8),out:Math.round(n(T.out,0,8,0)),outAt:n(T.outAt,0,600,9),outDur:n(T.outDur,.05,5,.8),ease:Math.round(n(T.ease,0,11,5)),fps:[0,6,8,10,12,15,24].includes(+T.fps)?+T.fps:0};}
    if(l.type==='sdfscene')o.prims=undefined;
    try{kids.push(makeLayer(l.type,o));}catch(_){}}
  if(!kids.length)throw new Error('A válaszból nem jött létre használható réteg.');
  const g=makeGroup(String(sp.name||'Leírásból').slice(0,40),kids,{open:true});const items=[];
  const R=sp.baseRecipe&&RECIPES.find(r=>r.n===sp.baseRecipe);if(R)items.push(makeRecipe(R));items.push(g);
  let cam=null;if(sp.cam&&typeof sp.cam==='object'){cam=mkCam();cam.on=true;for(const d of CAMP)if(sp.cam[d.k]!=null)cam.n[d.k]=mkN(specVal(sp.cam[d.k],d));}
  return {items,cam,dur:isFinite(+sp.dur)?Math.min(120,Math.max(1,+sp.dur)):null};}
function descModal(){
  const ta=h('textarea',{class:'txt',rows:'5',id:'descText','aria-label':'A jelenet leírása',placeholder:'Pl. Éjszakai város fölött lassan felkel a hold, a kamera előre úszik, a közepén rugóval beugrik a cím: „Holdkelte”, alatta kisebb felirat. Filmes, kékes-arany hangulat.'});
  try{ta.value=localStorage.getItem('latomas2.desc')||'';}catch(_){}
  const durS=h('select',{'aria-label':'Hossz',id:'descDur'},...[5,8,10,15,20].map(x=>{const o=h('option',{value:x},x+' mp');if(x===Math.round(st.dur))o.selected=true;return o;}));
  const modeS=h('select',{'aria-label':'Hová kerüljön',id:'descMode'},h('option',{value:'add'},'Hozzáadás a jelenethez'),h('option',{value:'replace'},'Új jelenet (a mostani lecserélése)'));
  const stat=h('p',{class:'small',id:'descStat'},'Claude a leírásból rétegeket, kulcskockákat, átmeneteket és szükség esetén kamerát rak össze. Az eredmény teljesen szerkeszthető, a ⌘Z visszavonja.');
  const go=h('button',{class:'btn accent',type:'button'},'Jelenet létrehozása');const stop=h('button',{class:'btn',type:'button',hidden:true},'Leállítás');let ctl=null;
  stop.onclick=()=>ctl&&ctl.abort();
  go.onclick=async()=>{const text=ta.value.trim();if(!text){ta.focus();return;}if(!SAMPLE){stat.textContent='Ebben a nézetben Claude nem érhető el.';return;}
    try{localStorage.setItem('latomas2.desc',text);}catch(_){}
    ctl=new AbortController();go.disabled=true;stop.hidden=false;stat.textContent='Claude gondolkodik… (általában 20–60 mp)';let chars=0;
    try{const sp=await SAMPLE.json(descPrompt(text,+durS.value),{signal:ctl.signal,cache:false,onText:({text})=>{chars=text.length;stat.textContent=`Claude írja a jelenetet… ${chars} karakter`;}});
      const r=buildFromSpec(sp);if(modeS.value==='replace')st.layers=[];
      for(const it of r.items)st.layers.push(it);if(r.cam)st.cam=r.cam;st.dur=r.dur||+durS.value;selId=r.items[r.items.length-1].id;time=0;resetFeedback();
      commit();renderAll();closeModal();setPlay(true);toast(`Kész: ${r.items[r.items.length-1].name} · ${r.items[r.items.length-1].children.length} réteg${r.cam?' · kamerával':''}`);}
    catch(e){const c=e&&e.code;stat.textContent=c==='cancelled'?'Leállítva.':c==='not_granted'||c==='sampling_disabled'?'Claude használata ennél a lapnál nincs engedélyezve.':c==='rate_limited'?'Most túl sok a kérés. Próbáld újra kicsit később.':c==='invalid_json'?'A válasz nem volt értelmezhető. Fogalmazd rövidebben, vagy próbáld újra.':c==='refused'?'Erre a leírásra Claude nem készít jelenetet. Fogalmazd át.':(e&&e.message)||'Nem sikerült. Próbáld újra.';
      if(c==='not_granted'||c==='sampling_disabled'){go.hidden=true;$('#descBtn').hidden=true;}}
    finally{go.disabled=false;stop.hidden=true;ctl=null;}};
  openModal(h('h2',null,'Leírásból animáció'),h('p',null,'Írd le, mit szeretnél látni: témát, hangulatot, színeket, szöveget, mozgást, kameramozgást.'),ta,
    h('div',{class:'row2'},h('span',null,'Hossz'),h('div',{class:'pop'},durS)),h('div',{class:'row2'},h('span',null,'Hová'),h('div',{class:'pop'},modeS)),stat,
    h('div',{class:'bar2'},h('button',{class:'btn',type:'button',onclick:()=>{ctl&&ctl.abort();closeModal();}},'Mégse'),stop,go));}
$('#descBtn').onclick=descModal;

/* ================= Keyboard ================= */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  if(e.key==='Escape'){closePop();if(tlxSels.length){tlxSels=[];renderTracks();}return;}
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  const mod=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();dupSel();return;}
  if(mod&&k==='g'){e.preventDefault();groupSel();return;}
  if(mod&&k==='c'){const L=sel();if((tlxSels.length||L)&&copyKeys(L,time)){e.preventDefault();toast(`${keyClip.length} kulcskocka másolva`);}return;}
  if(mod&&k==='v'){const L=sel();if(L&&keyClip){e.preventDefault();const n=pasteKeys(L,time);if(n){commit();renderInsp();toast(`${n} kulcskocka beillesztve @ ${fmtT(time)}`);}}return;}
  if(mod&&k==='a'&&tlxOpen){e.preventDefault();tlxSels=[];const L=sel();for(const r of trackRows())if(!L||r.L.id===L.id)for(const t of layerKeyTimes(r.L).keys())tlxSels.push({id:r.L.id,t});renderTracks();toast(`${tlxSels.length} kulcskocka-időpont kijelölve`);return;}
  if(mod)return;
  if(e.key===' '){e.preventDefault();setPlay(!playing);}
  else if(k==='v')setTool('move');else if(k==='o')setTool('orbit');else if(k==='r')runRandom(true);
  else if(k==='g')$('#gizmoBtn').click();else if(k==='f')toggleFS();
  else if(k==='h'){const L=sel();if(L){L.vis=!L.vis;commit();renderLayers();}}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(tlxSels.length){const n=deleteSelKeys();commit();renderInsp();toast(`${n} kulcskocka törölve`);}else delSel();}
  else if(e.key===']')moveSel(1);else if(e.key==='[')moveSel(-1);
  else if(e.key==='Home'){time=0;resetFeedback();audioRestart();}
  else if(k==='k'){const L=sel();if(L){const on=keyIdx(L.n.x,time)>=0;for(const q of ['x','y','s','r']){const i=keyIdx(L.n[q],time);if(on){if(i>=0)delKey(L.n[q],i);}else setKey(L.n[q],time,curV(L.n[q]));}commit();renderInsp();toast(on?'Elhelyezés-kulcskocka törölve':`Elhelyezés-kulcskocka @ ${fmtT(time)}`);}}
  else if(e.key===','||e.key==='.'){const L=sel();if(L){const ts=[];for(const o of [L.n,L.p||{}])for(const q in o)if(hasK(o[q]))o[q].k.forEach(x=>ts.push(x.t));ts.sort((a,b)=>a-b);
    const nx=e.key==='.'?ts.find(x=>x>time+KEY_EPS):[...ts].reverse().find(x=>x<time-KEY_EPS);if(nx!=null)seekTo(nx);}}
  markDirty();
});

/* ================= Boot ================= */
(function boot(){
  let ok=false;
  try{const a=localStorage.getItem('latomas2.auto');if(a){const o=JSON.parse(a);Object.assign(assets,o.assets||{});for(const id in assets)loadAsset(id);
    st.layers=(o.state.layers||[]).filter(l=>l.type==='group'||EFFECTS[l.type]).map(normalize);st.bg=o.state.bg||st.bg;st.size=o.state.size||st.size;st.look=normLook(o.state.look);st.cam=normCam(o.state.cam);setTL(o.state);ok=st.layers.length>0;}}catch(_){}
  if(!ok)st.layers=[makeRecipe(RECIPES[0])];
  selId=(st.layers[st.layers.length-1]||{}).id||null;
  resizeMain();renderAll();commit();buildCats();buildShelf();setPlay(true);updLookLbl();setTlx(tlxOpen);
  requestAnimationFrame(t=>{last=t;frame(t);});
  const keys=Object.keys(EFFECTS).filter(k=>k!=='custom'&&!EFFECTS[k].points&&EFFECTS[k].code);let ki=0;
  const idle=window.requestIdleCallback||((f)=>setTimeout(()=>f({timeRemaining:()=>8}),120));
  const warm=dl=>{while(ki<keys.length&&dl.timeRemaining()>6){try{getProg({type:keys[ki]});}catch(_){}ki++;}if(ki<keys.length)idle(warm);};
  setTimeout(()=>idle(warm),2500);
})();
