<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Unbounded:wght@300;700&family=Syne:wght@500;800&family=Orbitron:wght@500;800&family=Major+Mono+Display&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Instrument+Sans:wght@400;600;700&family=Bricolage+Grotesque:wght@400;700;800&family=Fraunces:wght@400;700&display=swap">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <header class="bar panel">
    <div class="brand"><i aria-hidden="true"></i>Vel</div>
    <div class="grow"></div>
    <div class="transport">
      <button class="ib" id="rewBtn" title="Go to start" aria-label="Go to start"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
      <button class="ib" id="playBtn" title="Play or pause" aria-label="Play or pause"></button>
      <span class="time" id="timeOut">0:00.0</span>
      <button class="ib rec" id="recBtn" title="Record a 10-second video" aria-label="Record video"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></button>
    </div>
    <div class="grow"></div>
    <button class="ib" id="undoBtn" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redoBtn" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="pill" id="canvasBtn" title="Canvas settings"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/></svg><span id="canvasLbl">1920 × 1080</span></button>
    <button class="pill" id="projBtn" title="Project" data-cat="library" aria-label="Project"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Project</span></button>
    <button class="pill" id="audBtn" title="Audio and cues" data-cat="text" aria-label="Audio"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span class="lbl">Audio</span></button>
    <button class="pill" id="rndBtn" title="Random vision" data-cat="random" aria-label="Randomize"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg><span class="lbl">Randomize</span></button>
    <button class="pill" id="descBtn" hidden title="Animate from a description" data-cat="effect" aria-label="From description"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span class="lbl">From description</span></button>
    <button class="pill" id="lookBtn" title="Rendering and color"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span id="lookLbl">Cinematic</span></button>
    <button class="pill accent" id="exportBtn" title="Export"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
    <button class="ib" id="keysBtn" aria-pressed="false" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    <button class="ib" id="helpBtn" title="How Vel works" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
  </header>

  <div class="side" id="side">
  <section class="shelf panel" id="shelf" aria-label="Library">
    <div class="shead"><input id="libSearch" type="search" placeholder="Search Library" aria-label="Search Library"><div class="seg" id="cats"></div><span class="hint" id="shelfHint"></span></div>
    <div class="items" id="items"></div>
  </section>

    <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="Library and Layers divider" tabindex="0" title="Resize sidebar sections"></div>
  <section class="layers panel" aria-label="Layers">
    <div class="ph">Layers<span class="small" id="layerCount"></span></div>
    <ul class="ltree" id="ltree"></ul>
    <div class="lfoot">
      <button class="ib" id="grpBtn" title="Group layers" aria-label="Group layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button class="ib" id="dupBtn" title="Duplicate" aria-label="Duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button class="ib" id="upBtn" title="Move layer up" aria-label="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 14 6-6 6 6"/></svg></button>
      <button class="ib" id="downBtn" title="Move layer down" aria-label="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 10 6 6 6-6"/></svg></button>
      <button class="ib" id="delBtn" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    </div>
  </section>

  </div>

  <main class="stage panel">
    <div class="wrap" id="wrap">
      <canvas id="cv" width="960" height="540"></canvas>
      <div class="gizmo" id="gizmo" hidden><div class="ring"></div><div class="stem"></div><div class="dot"></div><div class="h s" data-h="s" title="Scale"></div><div class="h r" data-h="r" title="Rotate"></div></div>
      <div class="hudbar" role="toolbar" aria-label="Tools">
        <button class="ib" data-tool="move" aria-pressed="true" title="Move and scale" aria-label="Move"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
        <button class="ib" data-tool="orbit" aria-pressed="false" title="Orbit in 3D" aria-label="3D orbit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></button>
        <span class="sepv"></span>
        <button class="ib" id="animBtn" aria-pressed="false" title="Animate mode" aria-label="Animate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M9 4.5 15.5 11 9 17.5 2.5 11z"/><circle cx="18.5" cy="17.5" r="3.2" fill="currentColor" stroke="none"/></svg></button><button class="ib" id="perfBtn" aria-pressed="false" title="Perform mode" aria-label="Perform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 17c3-6 5 2 8-4s5 1 8-5"/><circle cx="20" cy="8" r="1.6" fill="currentColor"/></svg></button><input id="perfSmooth" type="range" min="0" max="1" step="0.01" value="0.5" hidden aria-label="Perform smoothing" title="Performance smoothing"><button class="ib" id="gizmoBtn" aria-pressed="true" title="Handles" aria-label="Handles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><rect x="17" y="17" width="4" height="4" fill="currentColor"/></svg></button>
        <button class="ib" id="fsBtn" aria-pressed="false" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="audition" id="audition" hidden></div>
      <div class="hud" id="hud"></div>
      <div class="drophint" id="dropHint" hidden></div>
      <div class="keyhelp" id="keyHelp" hidden role="note" aria-label="Keyboard shortcuts"></div>
      <div class="scn" id="scn" hidden role="region" aria-label="Scenes"></div>
      <div class="tlx" id="tlx" hidden role="region" aria-label="Timeline tracks"><div id="tlxBody"></div></div>
      <div class="tl" id="tl"><button class="ib" id="tlxBtn" aria-pressed="false" title="Tracks" aria-label="Timeline tracks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M4 12h16M4 18h6"/><path d="M16 4.5 17.5 6 16 7.5 14.5 6z" fill="currentColor"/><path d="M13 16.5 14.5 18 13 19.5 11.5 18z" fill="currentColor"/></svg></button><button class="ib" id="scnBtn" aria-pressed="false" title="Scenes" aria-label="Scenes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="6" width="8" height="12" rx="1.5"/><rect x="13.5" y="6" width="8" height="12" rx="1.5"/></svg></button><button class="ib" id="camBtn" aria-pressed="false" title="Camera" aria-label="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3z"/></svg></button><button class="ib" id="loopBtn" aria-pressed="true" title="Loop" aria-label="Loop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button><div class="tl-track" id="tlTrack"><div class="tl-segs" id="tlSegs"></div><div class="tl-head" id="tlHead"></div></div><button class="tl-over" id="tlOver" hidden type="button" title="Continue beyond scene end">+0 s</button><input class="val" id="tlDur" aria-label="Timeline duration (s)" title="Timeline duration"><span class="small">s</span></div>
    </div>
  </main>

  <aside class="insp panel" aria-label="Properties"><div class="ibody" id="insp"></div></aside>
</div>

<div class="modal" id="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
